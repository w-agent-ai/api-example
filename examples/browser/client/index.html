<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W-Agent Browser Client</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #667085;
      --line: #d7dde5;
      --bg: #ffffff;
      --card: #ffffff;
      --accent: #0f62fe;
      --accent-dark: #0b4ed0;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", sans-serif;
      color: var(--ink);
      background: #fff;
      min-height: 100vh;
    }
    main {
      width: 100%;
      margin: 0;
      padding: 70px 18px 0;
    }
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
    }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 24px;
      min-width: 0;
      white-space: nowrap;
    }
    .site-nav a,
    .site-actions a {
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 520;
      line-height: 1;
    }
    .site-nav a:hover,
    .site-actions a:hover {
      color: var(--accent);
    }
    .site-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      white-space: nowrap;
    }
    .locale-inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }
    .locale-inline select {
      width: auto;
      height: 34px;
      min-height: 34px;
      padding: 5px 28px 5px 10px;
      border-radius: 999px;
      font-size: 13px;
    }
    .login-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      height: 34px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }
    .topbar {
      margin-bottom: 30px;
      text-align: center;
    }
    .topbar h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.05em;
    }
    .workspace {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-bottom: 20px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 126px 250px 150px 210px 300px 110px;
      column-gap: 25px;
      row-gap: 5px;
      align-items: start;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .control-row > label {
      display: grid;
      grid-template-rows: 46px 18px;
      gap: 5px;
    }
    #capabilityRow {
      position: relative;
    }
    .control-row > button {
      height: 46px;
      min-height: 46px;
      align-self: start;
      padding-top: 0;
      padding-bottom: 0;
    }
    #capabilityRow #status {
      position: absolute;
      left: 0;
      top: 51px;
      width: 710px;
    }
    .panel {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
    }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p { color: var(--muted); line-height: 1.75; margin: 0; }
    .badge {
      display: inline-flex;
      padding: 6px 10px;
      margin-bottom: 14px;
      border: 1px solid rgba(31, 122, 77, 0.25);
      color: var(--accent-dark);
      background: rgba(31, 122, 77, 0.08);
      font-weight: 760;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .form { display: grid; gap: 0; }
    .grid2 { display: contents; }
    label {
      display: grid;
      gap: 7px;
      color: var(--ink);
      font-weight: 720;
      font-size: 13px;
    }
    input, textarea, button, select { font: inherit; }
    input[type="text"], input[type="url"], input[type="password"], input[type="file"], textarea, select {
      width: 100%;
      height: 46px;
      min-height: 46px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 11px 12px;
      color: var(--ink);
      border-radius: 10px;
    }
    input[type="file"] {
      min-height: 46px;
      padding: 0 12px 0 0;
      line-height: 44px;
      color: transparent;
      overflow: hidden;
    }
    input[type="file"]::file-selector-button {
      height: 44px;
      margin: 0 10px 0 0;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 10px 0 0 10px;
      background: #f7f9fc;
      color: var(--ink);
      padding: 0 13px;
      cursor: pointer;
    }
    .file-picker-wrap {
      position: relative;
      min-width: 0;
      display: block;
    }
    .file-picker-wrap input[type="file"] {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-button-label {
      display: flex;
      align-items: center;
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f7f9fc;
      color: var(--ink);
      font-size: 14px;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .file-name-label {
      position: absolute;
      left: 90px;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    .file-name-label:empty {
      display: none;
    }
    textarea {
      height: 46px;
      min-height: 46px;
      resize: none;
    }
    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      border-radius: 10px;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .disabled-field {
      opacity: 0.62;
    }
    .disabled-field input,
    .disabled-field textarea {
      background: #f7f9fc;
      color: var(--muted);
      cursor: not-allowed;
    }
    .status {
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 18px;
    }
    .status.error { color: var(--danger); }
    .runtime-info {
      min-height: 18px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 800;
      line-height: 18px;
    }
    .required { color: var(--danger); margin-left: 3px; }
    .field-head {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .link-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      height: 18px;
      margin-top: 0;
      line-height: 18px;
    }
    .text-link {
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
    .text-link:hover { text-decoration: underline; }
    .action-row {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: -6px;
      font-size: 13px;
    }
    .action-row.show { display: flex; }
    .action-row a {
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }
    .action-row a:hover { text-decoration: underline; }
    .workdir-row {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }
    .workdir-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .workdir-controls button {
      padding: 7px 10px;
      font-size: 12px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .canvas-wrap {
      position: relative;
      overflow: hidden;
      height: calc(100vh - 156px);
      min-height: 280px;
      background: #fff;
      cursor: zoom-in;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-panel.pose-preview-mode {
      --pose-media-height: min(61vh, 576px);
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 0.95fr);
      grid-template-rows: var(--pose-media-height) auto;
      grid-template-areas:
        "pose2d pose3d"
        "pose2dControls pose3dControls";
      column-gap: 14px;
      row-gap: 6px;
      align-items: start;
      align-content: start;
      align-self: start;
    }
    .preview-panel.pose-preview-mode h2 {
      display: none;
    }
    .preview-panel.pose-preview-mode .canvas-wrap {
      grid-area: pose2d;
      height: var(--pose-media-height);
      min-height: 0;
    }
    .preview-panel.pose-preview-mode .result-assets {
      display: contents;
      border: 0;
      padding: 0;
      background: transparent;
      overflow: visible;
      max-height: none;
      margin-top: 0;
    }
    .pose-card {
      border: 0;
      background: transparent;
      padding: 0;
      min-width: 0;
    }
    .pose-card h3 { margin: 0 0 8px; font-size: 16px; }
    .pose-3d-stage { grid-area: pose3d; }
    .pose-2d-controls { grid-area: pose2dControls; }
    .pose-3d-controls { grid-area: pose3dControls; }
    .pose-3d-controls .pose-controls {
      margin-top: 0;
    }
    .pose-2d-controls .pose-controls {
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }
    .preview-panel.pose-preview-mode .canvas-wrap canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #101820;
      color: #d6f3df;
      padding: 16px;
      min-height: 360px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.55;
    }
    .result-assets {
      display: none;
      margin-top: 14px;
      border: 0;
      background: transparent;
      padding: 0;
      max-height: min(38vh, 360px);
      overflow: auto;
    }
    .result-assets.show { display: block; }
    .result-assets h3 { margin: 0 0 8px; font-size: 16px; }
    .result-assets a {
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }
    .result-assets a:hover { text-decoration: underline; }
    .result-assets video {
      display: block;
      width: 100%;
      max-height: 210px;
      margin-top: 10px;
      background: #101820;
    }
    .preview-panel.local-video-mode {
      display: flex;
      flex-direction: column;
      align-self: start;
    }
    .preview-panel.local-video-mode h2,
    .preview-panel.local-video-mode .canvas-wrap {
      display: none;
    }
    .preview-panel.local-video-mode .result-assets {
      display: block;
      margin-top: 0;
      max-height: none;
      overflow: visible;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .preview-panel.sequence-summary-mode .canvas-wrap {
      display: none;
    }
    .preview-panel.sequence-summary-mode .result-assets {
      display: block;
      max-height: none;
      overflow: visible;
      margin-top: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .preview-panel.sequence-summary-mode,
    .preview-panel.local-video-mode {
      display: flex;
      justify-content: center;
    }
    .sequence-summary-panel {
      width: min(980px, 100%);
      min-height: 420px;
      padding: 34px 44px;
      background: #f8faf7;
      color: var(--ink);
    }
    .sequence-summary-panel h2 {
      margin: 0 0 26px;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }
    .sequence-summary-list {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      column-gap: 16px;
      row-gap: 20px;
      margin: 0;
    }
    .sequence-summary-list dt {
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }
    .sequence-summary-list dd {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }
    .sequence-summary-section {
      margin-top: 28px;
    }
    .sequence-summary-section h3 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.3;
    }
    .sequence-summary-section p {
      color: #667085;
      font-size: 14px;
      line-height: 1.8;
    }
    .local-video-results {
      display: grid;
      gap: 12px;
    }
    .local-video-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 0 0 8px;
      border: 0;
      background: transparent;
    }
    .local-video-title {
      min-width: 0;
    }
    .local-video-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .local-video-actions button {
      padding: 8px 12px;
      font-size: 13px;
    }
    .local-video-compare-result {
      min-width: 180px;
      color: var(--accent-dark);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
    }
    .local-video-grid {
      --local-video-card-width: 112px;
      --local-video-card-height: 160px;
      --local-video-row-gap: 6px;
      display: grid;
      grid-template-columns: repeat(12, var(--local-video-card-width));
      gap: var(--local-video-row-gap);
      align-content: start;
      justify-content: start;
      min-height: calc(var(--local-video-card-height) * 4 + var(--local-video-row-gap) * 3);
    }
    .sequence-card {
      position: relative;
      border: 2px solid transparent;
      background: #fff;
      padding: 3px;
      cursor: pointer;
      min-width: 0;
      width: var(--local-video-card-width);
      height: var(--local-video-card-height);
      display: flex;
      flex-direction: column;
    }
    .sequence-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(31, 122, 77, 0.14);
    }
    .sequence-card.failed {
      opacity: 0.68;
    }
    .sequence-thumb {
      position: relative;
      background: #eef2ed;
      cursor: zoom-in;
      height: 132px;
      flex: 0 0 auto;
    }
    .sequence-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #eef2ed;
    }
    .sequence-thumb > div {
      width: 100%;
      height: 100%;
    }
    .sequence-select-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 18px;
      height: 18px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(16, 24, 32, 0.38);
      box-shadow: 0 2px 8px rgba(16, 24, 32, 0.18);
      cursor: pointer;
      z-index: 2;
    }
    .sequence-card.selected .sequence-select-badge {
      background: var(--accent);
    }
    .sequence-card-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sequence-card-title span:last-child {
      color: var(--muted);
      font-weight: 700;
    }
    .sequence-card-meta {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .local-video-page {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .local-video-page button {
      padding: 8px 12px;
      font-size: 13px;
    }
    .preview-panel.pose-preview-mode .pose-3d-stage video {
      display: block;
      width: auto;
      max-width: 100%;
      height: 100%;
      min-height: 0;
      max-height: none;
      margin: 0 auto;
      object-fit: contain;
      background: #101820;
    }
    .preview-panel.pose-preview-mode .pose-3d-stage {
      height: var(--pose-media-height);
    }
    .preview-panel.pose-preview-mode .pose-3d-stage #poseVideoSlot {
      height: 100%;
    }
    .pose-result-grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.85fr) minmax(320px, 1fr);
      gap: 14px;
      align-items: start;
    }
    .pose-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px;
      margin: 10px 0 12px;
    }
    .pose-controls label {
      width: 110px;
      gap: 4px;
    }
    .pose-controls input {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 9px;
      width: 100%;
    }
    .pose-controls button { padding: 9px 12px; }
    .pose-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 4px;
      margin-bottom: 0;
    }
    .pose-thumb {
      flex: 0 0 auto;
      width: 74px;
      border: 2px solid transparent;
      background: #f8faf7;
      padding: 4px;
      cursor: pointer;
    }
    .pose-thumb.active { border-color: var(--accent); }
    .pose-thumb img {
      display: block;
      width: 62px;
      height: 62px;
      object-fit: cover;
    }
    .pose-thumb span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(16, 24, 32, 0.82);
      cursor: zoom-out;
    }
    .lightbox.show { display: flex; }
    .lightbox canvas {
      max-width: 96vw;
      max-height: 92vh;
      background: #fff;
    }
    .sequence-lightbox {
      display: none;
      flex-direction: column;
      gap: 12px;
      max-width: 92vw;
      max-height: 92vh;
      padding: 14px;
      background: #fff;
      cursor: default;
    }
    .lightbox.sequence-mode canvas { display: none; }
    .lightbox.sequence-mode .sequence-lightbox { display: flex; }
    .sequence-lightbox img {
      display: block;
      max-width: 86vw;
      max-height: 76vh;
      object-fit: contain;
      background: #eef2ed;
    }
    .sequence-lightbox-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--ink);
      font-size: 13px;
    }
    .sequence-lightbox-controls button {
      padding: 7px 12px;
      font-size: 13px;
    }
    .hint { font-size: 13px; color: var(--muted); line-height: 18px; }
    .hint:empty { display: none; }
    #fileLabel:empty { display: none; }
    .status-row {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 18px;
      margin: 0 0 14px;
      text-align: center;
    }
    .json-panel {
      margin-top: 0;
      border-top: 0;
      padding-top: 0;
    }
    .json-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .json-head h2 { margin: 0; }
    .json-copy-hint {
      flex: 1;
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-button {
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .json-body {
      position: relative;
    }
    .json-panel pre {
      height: calc(100vh - 400px);
      max-height: none;
      min-height: 240px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 14px;
      font-size: 12px;
      line-height: 1.55;
      border-radius: 10px;
    }
    @media (max-width: 900px) {
      .site-header {
        position: static;
        height: auto;
        padding: 14px 12px;
        align-items: flex-start;
        gap: 14px;
      }
      .site-nav {
        flex-wrap: wrap;
        gap: 12px 16px;
      }
      .site-actions {
        flex-shrink: 0;
      }
      main {
        padding-top: 24px;
      }
      .workspace, .control-row {
        grid-template-columns: 1fr;
      }
      .local-video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .preview-panel.pose-preview-mode {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "pose2d"
          "pose3d"
          "pose2dControls"
          "pose3dControls";
      }
      .pose-result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="W-Agent navigation">
      <a href="https://www.w-agent.cn/portal" target="_blank" rel="noopener" data-i18n="navHome">首页</a>

    function t(key) {
      return i18n[locale]?.[key] || i18n["zh-CN"][key] || key;
    }

    function applyLocale(nextLocale) {
      locale = nextLocale === "en-US" ? "en-US" : "zh-CN";
      localStorage.setItem("wAgentBrowserLocale", locale);
      document.documentElement.lang = locale;
      const select = $("localeSelect");
      if (select) select.value = locale;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
      });
      document.title = t("browserTitle");
      updateForm();
    }

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").className = isError ? "status error" : "status";
    }

    function setRuntimeInfo(message) {
      $("runtimeInfo").textContent = message || "";
    }

    function safePathPart(value) {
      return String(value || "result")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "_")
        .replace(/\s+/g, "_")
        .slice(0, 80) || "result";
    }

    function timestampPart() {
      return new Date().toISOString().replace(/[:.]/g, "-");
    }

    function capabilityName(value) {
      return {
        locate: "object_search",
        sequence: "sequence",
        gaitPose: "gait_pose",
        localVideo: "local_video",
      }[value] || "result";
    }

    function jsonDisplayData(capability, data) {
      if (capability !== "sequence") return data;
      return stripSequenceFramesForDisplay(data);
    }

    function stripSequenceFramesForDisplay(value) {
      if (Array.isArray(value)) return value.map(stripSequenceFramesForDisplay);
      if (!value || typeof value !== "object") return value;
      const out = {};
      Object.entries(value).forEach(([key, item]) => {
        if (key === "frames") return;
        out[key] = stripSequenceFramesForDisplay(item);
      });
      return out;
    }

    function showJSONResult(capability, data) {
      $("raw").textContent = JSON.stringify(jsonDisplayData(capability, data), null, 2);
    }

    async function chooseWorkdir() {
      if (!window.showDirectoryPicker) {
        setStatus("当前浏览器不支持选择结果保存目录，请使用最新版 Chrome 或 Edge。", true);
        return;
      }
      workdirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      $("workdirLabel").textContent = `已选择：${workdirHandle.name}`;
      setStatus("结果保存目录已选择。");
    }

    async function writeTextFile(dirHandle, filename, text) {
      const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
    }

    function base64ToBlob(base64, mime = "image/jpeg") {
      const bytes = Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));
      return new Blob([bytes], { type: mime });
    }

    async function writeBlobFile(dirHandle, filename, blob) {
      const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    async function canvasToBlob(canvas, mime = "image/jpeg", quality = 0.92) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("canvas export failed"));
        }, mime, quality);
      });
    }

    function frameAliases(frame, index) {
      const aliases = new Set();
      const add = (value) => {
        if (value === undefined || value === null || value === "") return;
        aliases.add(String(value));
        const numeric = Number(value);
        if (Number.isFinite(numeric)) aliases.add(String(numeric));
      };
      add(index);
      add(index + 1);
      add(frame?.index);
      add(frame?.image_id);
      add(frame?.imageId);
      add(frame?.frame_id);
      add(frame?.frameId);
      add(frame?.filename);
      add(frame?.name);
      return aliases;
    }

    function frameIDFromValue(value) {
      if (value === undefined || value === null || value === "") return "";
      if (typeof value === "object") {
        return frameIDFromValue(value.imageId ?? value.image_id ?? value.frame_id ?? value.frameId ?? value.index ?? value.filename ?? value.name);
      }
      return String(value);
    }

    function sequenceFrameIDs(seq) {
      const ids = [];
      const push = (value) => {
        const id = frameIDFromValue(value);
        if (id) ids.push(id);
      };
      const arrays = [
        seq?.image_ids,
        seq?.imageIds,
        seq?.frame_ids,
        seq?.frameIds,
        seq?.image_id_list,
        seq?.frames,
        seq?.images,
      ];
      arrays.forEach((items) => {
        if (!Array.isArray(items)) return;
        items.forEach(push);
      });
      return Array.from(new Set(ids));
    }

    function framesForSequence(seq, sourceFrames) {
      const frames = Array.isArray(sourceFrames) ? sourceFrames : [];
      if (!frames.length) return [];
      const ids = sequenceFrameIDs(seq);
      if (!ids.length) return [];
      const wanted = new Set(ids.map(String));
      const matched = frames.filter((frame, index) => {
        const aliases = frameAliases(frame, index);
        for (const alias of aliases) {
          if (wanted.has(alias)) return true;
        }
        return false;
      });
      return matched;
    }

    function outputSequencePayloads(data) {
      return sequencePayloads(data).filter((seq) => seq && typeof seq === "object");
    }

    async function writeFrames(dirHandle, frames) {
      const frameDir = await dirHandle.getDirectoryHandle("frames", { create: true });
      for (let i = 0; i < frames.length; i += 1) {
        const base64 = frames[i]?.content_base64;
        if (!base64) continue;
        const frameID = String(frames[i].frame_id || frames[i].image_id || frames[i].index + 1 || i + 1).padStart(6, "0");
        await writeBlobFile(frameDir, `${safePathPart(frameID)}.jpg`, base64ToBlob(base64));
      }
    }

    async function saveSequenceOutputs(rootDir, sequences, sourceFrames, startID = 1) {
      const payloads = (Array.isArray(sequences) ? sequences : []).filter((seq) => seq && typeof seq === "object");
      if (!payloads.length) return 0;
      const sequencesDir = await rootDir.getDirectoryHandle("sequences", { create: true });
      let saved = 0;
      for (const seq of payloads) {
        const displayID = startID + saved;
        const sequenceDir = await sequencesDir.getDirectoryHandle(`ID_${String(displayID).padStart(4, "0")}`, { create: true });
        await writeTextFile(sequenceDir, "result.json", JSON.stringify(seq, null, 2));
        const frames = framesForSequence(seq, sourceFrames);
        if (frames.length) await writeFrames(sequenceDir, frames);
        saved += 1;
      }
      return saved;
    }

    async function saveLocalVideoDisplayItem(rootDir, item, displayID) {
      if (!rootDir || !item || item.status === "failed" || !item.result) return 0;
      const id = Number(displayID || item.display_id || 0);
      if (!Number.isFinite(id) || id <= 0) return 0;
      const sequencesDir = await rootDir.getDirectoryHandle("sequences", { create: true });
      const sequenceDir = await sequencesDir.getDirectoryHandle(`ID_${String(id).padStart(4, "0")}`, { create: true });
      const payloads = outputSequencePayloads(item.result);
      const resultPayload = payloads.length === 1 ? { ...payloads[0], display_id: id } : {
        display_id: id,
        sequence_id: item.sequence_id || "",
        source_sequence_id: item.source_sequence_id || "",
        track_id: item.track_id || "",
        source_frames: item.source_frames || 0,
        uploaded_frames: item.uploaded_frames || 0,
        result: item.result,
      };
      await writeTextFile(sequenceDir, "result.json", JSON.stringify(resultPayload, null, 2));
      const frames = localVideoFramesForItem(item);
      if (frames.length) await writeFrames(sequenceDir, frames);
      return 1;
    }

    async function beginLocalVideoSaveSession() {
      if (!workdirHandle) return null;
      const dirname = `w-agent-${capabilityName("localVideo")}-${timestampPart()}`;
      const dir = await workdirHandle.getDirectoryHandle(dirname, { create: true });
      currentResultDirHandle = dir;
      currentResultCapability = "localVideo";
      const sequencesDir = await dir.getDirectoryHandle("sequences", { create: true });
      await writeTextFile(dir, "result.json", JSON.stringify({ local_video: { results: [] } }, null, 2));
      return { dirname, dir, sequencesDir, savedItems: new Set() };
    }

    async function saveLocalVideoItemRealtime(context, item, displayID) {
      if (!context || !item || item.status === "failed" || !item.result) return 0;
      const id = Number(displayID || item.display_id || 0);
      if (!Number.isFinite(id) || id <= 0) return 0;
      const key = String(id);
      if (context.savedItems.has(key)) return 0;
      const saved = await saveLocalVideoDisplayItem(context.dir, item, id);
      if (saved > 0) {
        context.savedItems.add(key);
      }
      return saved;
    }

    async function finishLocalVideoSaveSession(context, data) {
      if (!context) return "";
      await writeTextFile(context.dir, "result.json", JSON.stringify(data, null, 2));
      return context.dirname;
    }

    function pose2DCanvasForFrame(image, data, frameIndex) {
      const pose = data?.result?.pose_2ds || data?.pose_2ds || [];
      const index = Math.min(Math.max(0, frameIndex || 0), Math.max(0, pose.length - 1));
      const canvas = document.createElement("canvas");
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0);
      const points = posePoints2D(pose[index] || []);
      const canvasPoints = points.map((point) => posePointToCanvas(point, width, height));
      ctx.lineWidth = Math.max(2, Math.round(width / 380));
      pose2DPairs.forEach(([a, b]) => {
        const p1 = canvasPoints[a];
        const p2 = canvasPoints[b];
        if (!p1 || !p2 || p1.score <= 0.05 || p2.score <= 0.05) return;
        ctx.strokeStyle = "#1f7a4d";
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });
      canvasPoints.forEach((point) => {
        if (point.score <= 0.05) return;
        ctx.fillStyle = "#ff3b30";
        ctx.beginPath();
        ctx.arc(point.x, point.y, Math.max(3, width / 180), 0, Math.PI * 2);
        ctx.fill();
      });
      return canvas;
    }

    async function appendPose3DRenderToWorkdir(rendered) {
      if (!rendered?.blob || !currentResultDirHandle || currentResultCapability !== "gaitPose") return;
      const pose3DDir = await currentResultDirHandle.getDirectoryHandle("pose_3d", { create: true });
      pose3DRenderSaveIndex += 1;
      const id = String(pose3DRenderSaveIndex).padStart(3, "0");
      await writeBlobFile(pose3DDir, `render_${id}.webm`, rendered.blob);
      await writeTextFile(pose3DDir, `render_${id}_params.json`, JSON.stringify({
        fps: rendered.fps,
        width: rendered.width,
        height: rendered.height,
        yaw_deg: rendered.yaw_deg,
        pitch_deg: rendered.pitch_deg,
        frames: rendered.frames,
        mime_type: rendered.mime_type,
        size: rendered.size,
        saved_at: new Date().toISOString(),
      }, null, 2));
    }

    async function saveResultToWorkdir(capability, data) {
      if (!workdirHandle) return "";
      const dirname = `w-agent-${capabilityName(capability)}-${timestampPart()}`;
      const dir = await workdirHandle.getDirectoryHandle(dirname, { create: true });
      currentResultDirHandle = dir;
      currentResultCapability = capability;
      pose3DRenderSaveIndex = 0;
      await writeTextFile(dir, "result.json", JSON.stringify(data, null, 2));
      if (capability === "locate") {
        const canvas = $("canvas");
        if (canvas && canvas.width > 1 && canvas.height > 1) {
          await writeBlobFile(dir, "boxed.jpg", await canvasToBlob(canvas));
        }
      } else if (capability === "gaitPose") {
        const pose2Ds = data?.result?.pose_2ds || data?.pose_2ds || [];
        if (poseViewerState?.images?.length && pose2Ds.length) {
          const pose2DDir = await dir.getDirectoryHandle("pose_2d", { create: true });
          const count = Math.min(poseViewerState.images.length, pose2Ds.length);
          for (let i = 0; i < count; i += 1) {
            const canvas = pose2DCanvasForFrame(poseViewerState.images[i], data, i);
            await writeBlobFile(pose2DDir, `${String(i + 1).padStart(6, "0")}.jpg`, await canvasToBlob(canvas));
          }
        }
        if (poseViewerState?.lastRendered3D) await appendPose3DRenderToWorkdir(poseViewerState.lastRendered3D);
      } else if (capability === "sequence") {
        await saveSequenceOutputs(dir, outputSequencePayloads(data), lastInputFrames, 1);
      } else if (capability === "localVideo") {
        const results = localVideoComparableResults(data?.local_video || {});
        for (let i = 0; i < results.length; i += 1) {
          await saveLocalVideoDisplayItem(dir, results[i], results[i].display_id);
        }
      }
      return dirname;
    }

    function clearAction() {
      $("actionRow").className = "action-row";
      $("actionRow").innerHTML = "";
    }

    function clearResultAssets() {
      $("resultAssets").className = "result-assets";
      $("resultAssets").innerHTML = "";
      $("previewPanel").classList.remove("pose-preview-mode");
      $("previewPanel").classList.remove("local-video-mode");
      $("previewPanel").classList.remove("sequence-summary-mode");
      poseViewerState = null;
      localVideoViewState = { localVideo: null, page: 0, selected: [] };
      localVideoFrameStore = new Map();
      currentResultDirHandle = null;
      currentResultCapability = "";
      localVideoSaveContext = null;
      pose3DRenderSaveIndex = 0;
    }

    function clearPreviewCanvas() {
      const canvas = $("canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width || 1, canvas.height || 1);
      canvas.width = 1;
      canvas.height = 1;
    }

      const slot = $("poseVideoSlot");

    function baseURL() {
      if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        return window.location.origin.replace(/\/+$/, "");
      }
      return "https://www.w-agent.cn";
    }

      return baseURL() + "/portal" + anchor;

    function showAction(label, anchor = "") {
      $("actionRow").className = "action-row show";
      $("actionRow").innerHTML = `<span>下一步：</span><a href="${portalURL(anchor)}" target="_blank" rel="noopener">${label}</a>`;
    }

    function openAPIKeyPage(event) {
      if (event) event.preventDefault();
      window.open(portalURL("#apiKeySection"), "_blank", "noopener");
    }

    function browserFingerprint() {
      const parts = [
        navigator.userAgent || "",
        navigator.language || "",
        screen.width + "x" + screen.height,
        String(new Date().getTimezoneOffset()),
        navigator.hardwareConcurrency || "",
      ];
      return btoa(unescape(encodeURIComponent(parts.join("|")))).slice(0, 96);
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("read file failed"));
        reader.readAsDataURL(file);
      });
    }

    function dataURLBase64(dataURL) {
      return String(dataURL || "").split(",")[1] || "";
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("image load failed"));
        image.src = src;
      });
    }

    function sortedFiles() {
      return Array.from($("files").files || []).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    }

    function updateSelectedFileName(files) {
      const target = $("fileNameLabel");
      if (!target) return;
      const list = Array.from(files || []);
      if (!list.length) {
        target.textContent = "";
        return;
      }
      if (locale === "en-US") {
        target.textContent = list.length === 1 ? `${list[0].name} · 1 file` : `${list[0].name} · ${list.length} files total`;
      } else {
        target.textContent = list.length === 1 ? `${list[0].name} · 1 个文件` : `${list[0].name} · 共 ${list.length} 个文件`;
      }
    }

    async function loadFrames(files) {
      const frames = [];
      for (let i = 0; i < files.length; i += 1) {
        const dataURL = await readFileAsDataURL(files[i]);
        frames.push({
          index: i,
          frame_id: i + 1,
          image_id: i + 1,
          imageId: i + 1,
          filename: files[i].name,
          name: files[i].name,
          content_base64: dataURLBase64(dataURL),
        });
      }
      return frames;
    }

    function draw(image, boxes = []) {
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      const width = image.naturalWidth || image.videoWidth || image.width;
      const height = image.naturalHeight || image.videoHeight || image.height;
      const scale = Math.min(1280 / width, 720 / height, 1);
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      ctx.lineWidth = Math.max(2, Math.round(canvas.width / 360));
      ctx.font = Math.max(14, Math.round(canvas.width / 50)) + "px sans-serif";
      boxes.forEach((box, index) => {
        const x1 = Number(box.x1 ?? box.left ?? box[0] ?? 0) * scale;
        const y1 = Number(box.y1 ?? box.top ?? box[1] ?? 0) * scale;
        const rawX2 = Number(box.x2 ?? box.right ?? box[2] ?? ((Number(box.x1 ?? box.left ?? box[0] ?? 0)) + Number(box.width ?? 0)));
        const rawY2 = Number(box.y2 ?? box.bottom ?? box[3] ?? ((Number(box.y1 ?? box.top ?? box[1] ?? 0)) + Number(box.height ?? 0)));
        const x2 = rawX2 * scale;
        const y2 = rawY2 * scale;
        const label = String(box.label || box.name || ("box " + (index + 1)));
        ctx.strokeStyle = "#ff3b30";
        ctx.fillStyle = "#ff3b30";
        ctx.strokeRect(x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
        ctx.fillText(label, x1, Math.max(18, y1 - 6));
      });
    }

    function extractBoxes(data) {
      if (Array.isArray(data.boxes)) return data.boxes;
      const frames = data.sequence?.frames || data.result?.frames || [];
      return frames.map((frame) => {
        const rect = frame.rect || {};
        return {
          x1: rect.x || 0,
          y1: rect.y || 0,
          x2: (rect.x || 0) + (rect.width || 0),
          y2: (rect.y || 0) + (rect.height || 0),
          label: "frame " + (frame.frame_id ?? ""),
        };
      }).filter((box) => box.x2 > box.x1 || box.y2 > box.y1);
    }

    function compactFeature(value, max = 6) {
      const items = Array.isArray(value) ? value : [];
      if (!items.length) return "无";
      return items.slice(0, max).map((item) => Number(item).toFixed(4)).join(", ") + (items.length > max ? " ..." : "");
    }

    function sequenceResultPayload(data) {
      return sequenceResultPayloads(data)[0] || {};
    }

    function sequenceResultPayloads(data) {
      if (Array.isArray(data?.sequences)) return data.sequences;
      if (Array.isArray(data?.result?.sequences)) return data.result.sequences;
      const single = data?.sequence || data?.result?.sequence || data?.result;
      return single ? [single] : [];
    }

    function drawSequenceSummary(data) {

      const rows = [

        ctx.fillText(String(row[1]), 210, y);

    function renderSequenceSummary(data) {

        ["Frame Count", seq.frame_count ?? (seq.frames || []).length ?? "-"],
        ["Gait Feature", `${(seq.gait_feature || []).length} 维：${compactFeature(seq.gait_feature)}`],
        ["Face Feature", `${(seq.face_feature || []).length} 维：${compactFeature(seq.face_feature)}`],
        ["ReID Feature", `${(seq.reid_feature || []).length} 维：${compactFeature(seq.reid_feature)}`],

    const DEFAULT_POSE_2D_PAIRS_TEXT = "0-1,0-2,1-3,2-4,5-7,7-9,6-8,8-10,5-6,5-11,6-12,11-13,13-15,12-14,14-16";
    const DEFAULT_POSE_3D_PAIRS_TEXT = "0-1,1-2,2-3,0-4,4-5,5-6,0-7,7-8,8-9,8-11,8-14,9-10,11-12,12-13,14-15,15-16";
    let pose2DPairs = parsePosePairs(DEFAULT_POSE_2D_PAIRS_TEXT);
    let pose3DPairs = parsePosePairs(DEFAULT_POSE_3D_PAIRS_TEXT);

    function parsePosePairs(text) {
      return String(text || "")
        .split(/[,\n;\s]+/)
        .map((item) => item.trim())
        .filter(Boolean)
        .map((item) => item.split("-").map((part) => Number(part.trim())))
        .filter((pair) => pair.length === 2 && pair.every((value) => Number.isInteger(value) && value >= 0 && value < 17));
    }

    function posePoints2D(frame) {
      const points = [];
      for (let i = 0; i + 2 < (frame || []).length; i += 3) {
        points.push({ x: Number(frame[i]), y: Number(frame[i + 1]), score: Number(frame[i + 2]) });
      }
      return points;
    }

    function posePointToCanvas(point, width, height) {
      return {
        x: width / 2 + point.x,
        y: height / 2 + point.y,
        score: point.score,
      };
    }

    function drawPose2DFrame(image, data, frameIndex) {
      const pose = data?.result?.pose_2ds || data?.pose_2ds || [];
      const index = Math.min(Math.max(0, frameIndex || 0), Math.max(0, pose.length - 1));
      draw(image, []);
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      const points = posePoints2D(pose[index] || []);
      const canvasPoints = points.map((point) => posePointToCanvas(point, canvas.width, canvas.height));
      ctx.lineWidth = Math.max(2, Math.round(canvas.width / 380));
      pose2DPairs.forEach(([a, b]) => {
        const p1 = canvasPoints[a];
        const p2 = canvasPoints[b];
        if (!p1 || !p2 || p1.score <= 0.05 || p2.score <= 0.05) return;
        ctx.strokeStyle = "#1f7a4d";
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });
      canvasPoints.forEach((point) => {
        if (point.score <= 0.05) return;
        ctx.fillStyle = "#ff3b30";
        ctx.beginPath();
        ctx.arc(point.x, point.y, Math.max(3, canvas.width / 180), 0, Math.PI * 2);
        ctx.fill();
      });
    }

    async function loadPoseImages(files) {

    function renderPoseFrame(index) {

    async function copyJSONResult() {

    async function setupPoseViewer(files, data) {

      $("resultAssets").innerHTML = `

      $("posePrevButton").addEventListener("click", () => renderPoseFrame((poseViewerState?.index || 0) - 1));
      $("poseNextButton").addEventListener("click", () => renderPoseFrame((poseViewerState?.index || 0) + 1));

    function pose3DFrames(data) {
      const pose3Ds = data?.result?.pose_3ds || data?.pose_3ds || [];
      return pose3Ds.map((frame) => {
        const points = [];
        for (let i = 0; i + 2 < (frame || []).length; i += 3) {
          points.push({ x: Number(frame[i]), y: Number(frame[i + 1]), z: Number(frame[i + 2]) });
        }
        return points;
      }).filter((frame) => frame.length >= 17);
    }

    function pose3DBounds(frames) {
      const bounds = { minX: Infinity, minY: Infinity, minZ: Infinity, maxX: -Infinity, maxY: -Infinity, maxZ: -Infinity };
      frames.forEach((frame) => frame.forEach((point) => {
        if (!Number.isFinite(point.x) || !Number.isFinite(point.y) || !Number.isFinite(point.z)) return;
        bounds.minX = Math.min(bounds.minX, point.x);
        bounds.minY = Math.min(bounds.minY, point.y);
        bounds.minZ = Math.min(bounds.minZ, point.z);
        bounds.maxX = Math.max(bounds.maxX, point.x);
        bounds.maxY = Math.max(bounds.maxY, point.y);
        bounds.maxZ = Math.max(bounds.maxZ, point.z);
      }));
      if (!Number.isFinite(bounds.minX)) return null;
      return bounds;
    }

    function projectPose3D(point, view, width, height) {
      const x = point.x - view.cx;
      const y = point.y - view.cy;
      const z = point.z - view.cz;
      const yaw = view.yaw;
      const pitch = view.pitch;
      const cosy = Math.cos(yaw);
      const siny = Math.sin(yaw);
      const cosp = Math.cos(pitch);
      const sinp = Math.sin(pitch);
      const rx = x * cosy - z * siny;
      const rz = x * siny + z * cosy;
      const ry = y * cosp - rz * sinp;
      const rz2 = y * sinp + rz * cosp;
      const depth = Math.max(0.2, view.distance + rz2);
      const perspective = view.distance / depth;
      const scaleX = Number.isFinite(view.scaleX) ? view.scaleX : view.scale;
      const scaleY = Number.isFinite(view.scaleY) ? view.scaleY : view.scale;
      return {
        x: width / 2 + (view.offsetX || 0) + rx * scaleX * perspective,
        y: height / 2 + (view.offsetY || 0) + ry * scaleY * perspective,
      };
    }

    function pose3DProjectedBounds(frames, view, width, height) {
      const bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      frames.forEach((frame) => frame.forEach((point) => {
        const projected = projectPose3D(point, view, width, height);
        if (!Number.isFinite(projected.x) || !Number.isFinite(projected.y)) return;
        bounds.minX = Math.min(bounds.minX, projected.x);
        bounds.minY = Math.min(bounds.minY, projected.y);
        bounds.maxX = Math.max(bounds.maxX, projected.x);
        bounds.maxY = Math.max(bounds.maxY, projected.y);
      }));
      if (!Number.isFinite(bounds.minX)) return null;
      return bounds;
    }

    function drawPose3DFrame(ctx, frame, view, width, height, index, total) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#edf1f5";
      ctx.lineWidth = 1;
      for (let x = 0; x <= width; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      const points = frame.map((point) => projectPose3D(point, view, width, height));
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      pose3DPairs.forEach(([a, b]) => {
        const p1 = points[a];
        const p2 = points[b];
        if (!p1 || !p2) return;
        ctx.strokeStyle = "#1f7a4d";
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });
      points.forEach((point, pointIndex) => {
        ctx.fillStyle = "#ff3b30";
        ctx.beginPath();
        ctx.arc(point.x, point.y, 7, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = "#667085";
      ctx.font = "16px sans-serif";
      ctx.fillText(`${index + 1} / ${total}`, 16, 26);
    }

    function numberFromInput(id, fallback, min, max) {
      const value = Number($(id)?.value);
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, value));
    }

    function pose3DRenderOptions() {
      return {
        fps: numberFromInput("poseFpsInput", 25, 1, 60),
        yawDeg: numberFromInput("poseYawInput", -30, -180, 180),
        pitchDeg: numberFromInput("posePitchInput", 15, -80, 80),
      };
    }

    function pose3DCanvasSize() {
      const source = $("canvas");
      const sourceHeight = Math.max(420, Number(source?.height || 0));
      const height = Math.min(720, sourceHeight);
      const width = Math.max(280, Math.round(height * 0.62));
      return { width, height };
    }

    async function renderPose3DVideoInBrowser(data, options = {}) {
      const frames = pose3DFrames(data);
      if (!frames.length) return null;
      if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        throw new Error("当前浏览器不支持本地视频录制，请使用最新版 Chrome、Edge 或 Firefox。");
      }
      const bounds = pose3DBounds(frames);
      if (!bounds) return null;
      const { width, height } = pose3DCanvasSize();
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      const maxAbs = Math.max(
        Math.abs(bounds.minX), Math.abs(bounds.maxX),
        Math.abs(bounds.minY), Math.abs(bounds.maxY),
        Math.abs(bounds.minZ), Math.abs(bounds.maxZ),
      );
      const normalizedRange = maxAbs <= 1.5;
      const spanX = bounds.maxX - bounds.minX;
      const spanY = bounds.maxY - bounds.minY;
      const spanZ = bounds.maxZ - bounds.minZ;
      const size = Math.max(spanX, spanY, spanZ, normalizedRange ? 0.75 : 1);
      const view = {
        cx: (bounds.minX + bounds.maxX) / 2,
        cy: (bounds.minY + bounds.maxY) / 2,
        cz: (bounds.minZ + bounds.maxZ) / 2,
        scale: 1,
        scaleX: 1,
        scaleY: 1,
        offsetX: 0,
        offsetY: 0,
        distance: normalizedRange ? 3.2 : Math.max(size * 2.5, 2),
        yaw: (Number(options.yawDeg ?? -30) * Math.PI) / 180,
        pitch: (Number(options.pitchDeg ?? 15) * Math.PI) / 180,
      };
      const projectedAtUnitScale = pose3DProjectedBounds(frames, view, width, height);
      if (projectedAtUnitScale) {
        const spanWidth = Math.max(1, projectedAtUnitScale.maxX - projectedAtUnitScale.minX);
        const spanHeight = Math.max(1, projectedAtUnitScale.maxY - projectedAtUnitScale.minY);
        const marginX = width * 0.04;
        const marginY = height * 0.04;
        view.scaleX = (width - marginX * 2) / spanWidth;
        view.scaleY = (height - marginY * 2) / spanHeight;
        view.scale = Math.min(view.scaleX, view.scaleY);
        const projected = pose3DProjectedBounds(frames, view, width, height);
        if (projected) {
          view.offsetX = width / 2 - (projected.minX + projected.maxX) / 2;
          view.offsetY = height / 2 - (projected.minY + projected.maxY) / 2;
        }
      } else {
        view.scale = Math.min(width, height) * (normalizedRange ? 0.82 : 0.55) / size;
      }
      const fps = Math.min(60, Math.max(1, Number(options.fps || 25)));
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
      const chunks = [];
      const recorder = new MediaRecorder(canvas.captureStream(fps), { mimeType });
      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size) chunks.push(event.data);
      };
      const stopped = new Promise((resolve) => {
        recorder.onstop = resolve;
      });
      recorder.start();
      for (let i = 0; i < frames.length; i += 1) {
        drawPose3DFrame(ctx, frames[i], view, width, height, i, frames.length);
        await new Promise((resolve) => setTimeout(resolve, 1000 / fps));
      }
      recorder.stop();
      await stopped;
      const blob = new Blob(chunks, { type: "video/webm" });
      return {
        url: URL.createObjectURL(blob),
        blob,
        frames: frames.length,
        size: blob.size,
        mime_type: blob.type,
        fps,
        width,
        height,
        yaw_deg: Number(options.yawDeg ?? -30),
        pitch_deg: Number(options.pitchDeg ?? 15),
      };
    }

    function drawLocalVideoSummary(localVideo) {
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      const results = localVideo.results || [];
      const successCount = results.filter((item) => item && item.status !== "failed").length;
      const failedCount = results.filter((item) => item && item.status === "failed").length;
      const thumbs = results.map((item) => localVideoPreviewBase64(item)).filter(Boolean);
      const width = 980;
      const height = Math.max(620, 300 + Math.ceil(Math.max(thumbs.length, 1) / 4) * 190);
      canvas.width = width;
      canvas.height = height;
      ctx.fillStyle = "#f8faf7";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#17212b";
      ctx.font = "800 34px sans-serif";
      ctx.fillText("本地视频解析结果", 48, 68);
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#667085";
      ctx.fillText("浏览器完成本地检测、跟踪、裁剪后，已并行调用序列 API。", 48, 100);

      const items = [
        ["有效序列", localVideo.uploaded_sequences ?? 0],
        ["上传帧数", localVideo.uploaded_frames ?? 0],
        ["解析成功", successCount],
        ["解析失败", failedCount],
        ["相似度对", (localVideo.similarity_pairs || []).length],
      ];
      items.forEach((item, index) => {
        const x = 48 + (index % 5) * 178;
        const y = 150 + Math.floor(index / 5) * 104;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#d7dde5";
        ctx.lineWidth = 1;
        ctx.fillRect(x, y, 170, 92);
        ctx.strokeRect(x, y, 170, 92);
        ctx.fillStyle = "#667085";
        ctx.font = "14px sans-serif";
        ctx.fillText(item[0], x + 18, y + 30);
        ctx.fillStyle = "#1f7a4d";
        ctx.font = "800 30px sans-serif";
        ctx.fillText(String(item[1]), x + 18, y + 68);
      });

      const timings = localVideo.timings_ms || {};
      const processed = Math.max(1, Number(localVideo.processed_frames || 0));
      const avg = (key) => (Number(timings[key] || 0) / processed).toFixed(1);
      ctx.fillStyle = "#17212b";
      ctx.font = "800 20px sans-serif";
      ctx.fillText("平均每帧耗时", 48, 295);
      ctx.font = "15px sans-serif";

      ctx.fillText(`解码 ${avg("seek_ms")}ms / 绘制 ${avg("draw_ms")}ms / 检测 ${avg("detect_ms")}ms / 裁剪 ${avg("crop_ms")}ms`, 48, 325);

      ctx.fillStyle = "#17212b";
      ctx.font = "800 20px sans-serif";
      ctx.fillText("序列摘要", 48, 380);
      ctx.font = "15px sans-serif";

          return `#${index + 1} sequence=${item.sequence_id} track=${item.track_id} frames=${item.uploaded_frames} 解析失败：${item.error || "unknown error"}`;
        }
        return `#${index + 1} sequence=${item.sequence_id} track=${item.track_id} frames=${item.uploaded_frames} 解析成功`;
      });
      if (!lines.length) lines.push("暂无序列结果。");

      if (results.length > lines.length) {
        ctx.fillText(`还有 ${results.length - lines.length} 个序列未在摘要中展示，完整结果见 JSON。`, 48, 412 + lines.length * 24);
      }
      thumbs.slice(0, 32).forEach((base64, index) => {

    function localVideoComparableResults(localVideo) {
      return (localVideo?.results || []).filter((item) => item && item.status !== "failed" && item.result);
    }

    function localVideoFramesForResult(result, fallbackFrames) {
      const sourceFrames = Array.isArray(fallbackFrames) ? fallbackFrames : [];
      if (!sourceFrames.length) return [];
      return framesForSequence(result, sourceFrames);
    }

    function localVideoFramesForItem(item) {
      if (!item) return [];
      const sourceFrames = localVideoFrameStore.get(sequenceKey(item.source_sequence_id)) || [];
      if (sourceFrames.length) {
        const matched = localVideoFramesForResult(item?.result, sourceFrames);
        return matched.length ? matched : sourceFrames;
      }
      const ownFrames = localVideoFrameStore.get(sequenceKey(item.sequence_id)) || [];
      if (ownFrames.length) {
        const matched = localVideoFramesForResult(item?.result, ownFrames);
        return matched.length ? matched : ownFrames;
      }
      return [];
    }

    function localVideoPreviewBase64(item) {
      if (!item) return "";
      const frames = localVideoFramesForItem(item);
      const previewFrame = frames[Math.floor(Math.max(0, frames.length - 1) / 2)] || frames[0];
      return item?.result?.sequence?.gait_images?.[0]
        || item?.result?.result?.gait_images?.[0]
        || previewFrame?.content_base64
        || "";
    }

    async function exportLocalVideoSequenceFrames(sequenceID) {
      const key = sequenceKey(sequenceID);
      const item = localVideoResultByID(key);
      if (!item) return;
      const frames = localVideoFramesForItem(item);
      if (!frames.length) {
        setStatus("该序列没有可保存的多帧图片。", true);
        return;
      }
      const displayIndex = localVideoResultDisplayIndex(key);
      const dirname = safePathPart(displayIndex >= 0 ? `ID_${String(displayIndex + 1).padStart(4, "0")}` : key);
      if (workdirHandle) {
        const root = await workdirHandle.getDirectoryHandle("w-agent-sequences", { create: true });
        const dir = await root.getDirectoryHandle(dirname, { create: true });
        await writeTextFile(dir, "result.json", JSON.stringify({
          display_id: displayIndex >= 0 ? displayIndex + 1 : null,
          sequence_id: item.sequence_id || "",
          track_id: item.track_id || "",
          source_frames: item.source_frames || 0,
          uploaded_frames: item.uploaded_frames || 0,
          result: item.result || null,
        }, null, 2));
        const preview = localVideoPreviewBase64(item);
        if (preview) await writeBlobFile(dir, "preview.jpg", base64ToBlob(preview));
        const frameDir = await dir.getDirectoryHandle("frames", { create: true });
        for (let i = 0; i < frames.length; i += 1) {
          const base64 = frames[i].content_base64;
          if (!base64) continue;
          const frameID = String(frames[i].frame_id || i + 1).padStart(6, "0");
          await writeBlobFile(frameDir, `${frameID}.jpg`, base64ToBlob(base64));
        }
        setStatus(`序列结果已保存到结果保存目录：w-agent-sequences/${dirname}`);
        return;
      }
      frames.forEach((frame, index) => {
        if (!frame.content_base64) return;
        const link = document.createElement("a");
        const frameID = String(frame.frame_id || index + 1).padStart(6, "0");
        link.href = "data:image/jpeg;base64," + frame.content_base64;
        link.download = `${dirname}_${frameID}.jpg`;
        document.body.appendChild(link);
        link.click();
        link.remove();
      });
      setStatus("未选择结果保存目录，已触发浏览器逐张下载序列图片。");
    }

    function toggleLocalVideoSequenceSelection(sequenceID) {
      const key = sequenceKey(sequenceID);
