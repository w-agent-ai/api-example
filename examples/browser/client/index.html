<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W-Agent Browser Client</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #637083;
      --line: #d8dee8;
      --soft: #f5f7fa;
      --panel: #ffffff;
      --accent: #0f62fe;
      --accent-dark: #0845a8;
      --ok: #16835f;
      --warn: #b7791f;
      --danger: #b42318;
      --shadow: 0 12px 32px rgba(18, 32, 54, 0.08);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      color: var(--ink);
      background: #eef2f6;
      font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", Arial, sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      min-height: 38px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.secondary:hover {
      color: var(--accent-dark);
      border-color: #9fb9e8;
      background: #f8fbff;
    }
    input[type="text"], input[type="password"], input[type="url"], input[type="number"], textarea, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
    }
    input:disabled, textarea:disabled, select:disabled {
      background: #eef2f6;
      color: var(--muted);
      cursor: not-allowed;
    }
    textarea { min-height: 82px; resize: vertical; }
    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      font-weight: 800;
    }
    .topbar {
      height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      overflow: auto hidden;
      scrollbar-width: none;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 760;
      white-space: nowrap;
    }
    .site-nav a:hover { color: var(--accent); }
    .site-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    .locale-inline {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
    }
    .locale-inline select {
      width: auto;
      min-height: 34px;
      padding: 5px 28px 5px 10px;
      border-radius: 999px;
      font-size: 13px;
    }
    .login-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      min-width: 70px;
      padding: 0 15px;
      border: 1px solid #4e6ef2;
      border-radius: 7px;
      color: #fff;
      background: #4e6ef2;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      line-height: 34px;
    }
    .login-link.active {
      max-width: 180px;
      border-color: transparent;
      background: transparent;
      color: #1f2933;
      padding: 0;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      padding: 16px 18px 18px;
      height: calc(100vh - 58px);
      min-height: 0;
    }
    .app.single-mode {
      grid-template-rows: minmax(0, 1fr);
    }
    .algorithm-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
    }
    .algorithm-tabs button {
      height: 46px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: 0 3px 10px rgba(18, 32, 54, 0.05);
    }
    .algorithm-tabs button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .workspace {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px;
      min-height: 0;
      overflow: hidden;
    }
    .settings, .display {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: 0;
    }
    .settings {
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr);
      align-content: start;
      gap: 14px;
      overflow: hidden;
    }
    .settings-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }
    .settings h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      min-width: 0;
    }
    .settings-grid { display: grid; gap: 12px; }
    #gaitSettings {
      margin-top: -6px;
    }
    #poseApiStatus,
    #poseBatchAPIHint {
      margin-top: -8px;
    }
    #poseParseStatus,
    #poseApiStatus,
    #poseBatchAPIHint {
      line-height: 1.35;
    }
    .example-video-section {
      display: grid;
      gap: 8px;
      margin-top: 2px;
    }
    .example-video-title {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }
    .example-video-list {
      display: grid;
      gap: 8px;
      max-height: 520px;
      overflow: auto;
      padding-right: 2px;
    }
    #gaitExampleSection {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
      align-content: start;
    }
    #gaitExampleSection .example-video-list {
      max-height: none;
      overflow: visible;
      padding-right: 0;
    }
    .example-video-card {
      display: grid;
      gap: 7px;
      align-items: center;
      min-height: 190px;
      height: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .example-video-card:hover {
      background: #f8fbff;
      border-color: #9fb9e8;
    }
    .example-video-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(15, 98, 254, 0.12);
    }
    .example-video-card video,
    .example-video-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      background: #f3f5f9;
      display: block;
      pointer-events: none;
    }
    .example-video-meta {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .example-video-meta strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      text-align: center;
    }
    .example-video-meta span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .api-key-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .api-key-input-row button {
      min-height: 42px;
      padding: 0 12px;
      white-space: nowrap;
    }
    .settings-head button {
      min-height: 34px;
      height: 34px;
      padding: 0 12px;
      justify-content: center;
      white-space: nowrap;
    }
    .identity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
    }
    .identity-toggle {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f8fafc;
      min-width: 156px;
    }
    .identity-toggle button {
      min-height: 32px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      border: 0;
      box-shadow: none;
      font-size: 13px;
    }
    .identity-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
    .inline-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
    }
    .gait-upload-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .time-range-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
      min-width: 300px;
    }
    .time-range-row label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }
    .time-range-row input {
      width: 82px;
      min-height: 30px;
      height: 30px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .time-unit-input {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .time-unit-input span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .time-range-row .status-inline {
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }
    .gait-upload-row label,
    .settings-grid label {
      min-width: 0;
    }
    .file-picker {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 42px;
    }
    .file-picker input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--ink);
      font-weight: 800;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 12px;
    }
    .hint, .status {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 560;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #noticeModalActions {
      justify-content: center;
    }
    .display {
      padding: 14px;
      overflow: hidden;
    }
    .result-layout {
      height: 100%;
      min-height: 0;
      display: grid;
      gap: 12px;
    }
    .locate-layout {
      grid-template-columns: minmax(0, 1fr);
    }
    .pose-layout {
      grid-template-columns: 130px minmax(0, 1fr);
    }
    .gait-layout {
      grid-template-columns: 130px minmax(360px, 1fr);
    }
    .section {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .video-section {
      grid-template-rows: minmax(0, 1fr);
    }
    .section-head {
      min-height: 46px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-head.paged {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
    }
    .section-head h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }
    .section-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }
    .gait-head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      min-width: 0;
      white-space: nowrap;
    }
    .section-pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .section-pager.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }
    .section-tools button {
      min-height: 30px;
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .gait-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .section-body {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }
    .canvas-stage {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      overflow: auto;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      background: #fff;
    }
    .sequence-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .sequence-list.single-column {
      grid-template-columns: 1fr;
    }
    .pose-sequence-body {
      display: block;
      overflow: hidden;
    }
    .pose-sequence-body .sequence-list {
      height: 100%;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .sequence-card {
      border: 2px solid transparent;
      border-radius: 8px;
      background: #f8fafc;
      padding: 6px;
      cursor: default;
      min-width: 0;
      display: grid;
      gap: 6px;
      position: relative;
    }
    .sequence-card:hover { border-color: #9fb9e8; }
    .sequence-card.selected {
      border-color: var(--accent);
      background: #edf5ff;
    }
    .sequence-card.has-feature {
      box-shadow: inset 0 0 0 2px rgba(22, 131, 95, 0.22);
    }
    .sequence-card.loading-feature {
      box-shadow: inset 0 0 0 2px rgba(183, 121, 31, 0.26);
    }
    .sequence-card.invalid {
      opacity: 0.55;
    }
    .sequence-thumb {
      height: 120px;
      border-radius: 6px;
      background: #e9eef5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    .sequence-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .sequence-meta {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .sequence-meta strong {
      color: var(--ink);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sequence-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .sequence-line strong {
      min-width: 0;
    }
    .sequence-line span {
      color: var(--muted);
      font-size: 12px;
    }
    .similarity {
      color: var(--accent-dark);
      font-weight: 900;
      font-size: 18px;
      white-space: nowrap;
      text-align: center;
    }
    .frame-viewer {
      display: grid;
      grid-template-rows: minmax(320px, min(70vh, 720px)) auto;
      gap: 12px;
      min-width: min(980px, calc(100vw - 64px));
    }
    .frame-stage {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .frame-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .frame-viewer-tools {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }
    .frame-viewer-tools span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }
    .video-grid {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      overflow: hidden;
    }
    .video-pair {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      overflow: hidden;
    }
    .video-box {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .video-box h3 {
      margin: 0;
      padding: 9px 10px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }
    .video-box video,
    .video-box canvas {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      background: #fff;
      display: block;
    }
    .video-box canvas {
      cursor: grab;
      touch-action: none;
    }
    #pose3DCanvas {
      background: #071019;
    }
    .video-box canvas.dragging {
      cursor: grabbing;
    }
    .sync-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .gait-columns {
      height: 100%;
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 10px;
      min-height: 0;
    }
    .empty {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      padding: 18px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2f6;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .pill.ok { background: #e7f6ef; color: var(--ok); }
    .pill.warn { background: #fff6dd; color: var(--warn); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.35);
      padding: 20px;
    }
    .modal {
      width: min(420px, 100%);
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      gap: 12px;
    }
    .modal h2 {
      margin: 0;
      font-size: 18px;
    }
    .modal p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .settings-modal-grid {
      display: grid;
      gap: 10px;
    }
    .settings-modal-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }
    .settings-modal-row input,
    .settings-modal-row select {
      min-height: 34px;
      height: 34px;
      padding: 5px 8px;
      font-size: 13px;
    }
    .cache-dir-line {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 980px) {
      .topbar { grid-template-columns: 1fr; height: auto; padding: 10px 14px; }
      .site-actions { justify-content: flex-end; }
      .app { padding: 12px; }
      .workspace, .locate-layout, .pose-layout, .gait-layout, .gait-columns, .video-pair {
        grid-template-columns: 1fr;
      }
      .gait-upload-row { grid-template-columns: 1fr; }
      .algorithm-tabs { grid-template-columns: 1fr; }
      .result-layout { min-height: 680px; }
      .section-head.paged { grid-template-columns: 1fr; }
      .gait-head-actions {
        justify-content: flex-start;
        flex-wrap: wrap;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="site-nav" aria-label="W-Agent navigation">
      <a href="https://www.w-agent.cn/portal" target="_blank" rel="noopener" data-i18n="navHome">首页</a>

    const pose2DPairs = [[0,1],[0,2],[1,3],[2,4],[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,13],[13,15],[12,14],[14,16]];
    const pose3DPairs = [[0,1],[1,2],[2,3],[0,4],[4,5],[5,6],[0,7],[7,8],[8,9],[8,11],[8,14],[9,10],[11,12],[12,13],[14,15],[15,16]];
    const poseScoreThreshold = 0.5;
    const pose3D2DSources = [[11,12],[12],[14],[16],[11],[13],[15],[11,12,5,6],[5,6],[0],[1,2],[5],[7],[9],[6],[8],[10]];
    const pose3DScoreFilteredJoints = new Set([1,2,3,4,5,6,12,13,15,16]);

    function isPosePointVisible(point) {
      return Boolean(point) && Number.isFinite(point.x) && Number.isFinite(point.y) && Number(point.score) >= poseScoreThreshold;
    }

    function pose3DVisibilityFromPose2DFrame(frame) {
      const points = posePoints(frame, 3);
      return pose3D2DSources.map((sources) => {
        const jointIndex = pose3D2DSources.indexOf(sources);
        if (!pose3DScoreFilteredJoints.has(jointIndex)) return true;
        return sources.every((index) => {
          const point = points[index];
          return Boolean(point) && Number(point.score) >= poseScoreThreshold;
        });
      });
    }

    function pose3DFramesWithVisibility(result) {
      const pose2Ds = poseArray(result, "pose_2ds");
      const frames = [];
      const visibleFrames = [];
      poseArray(result, "pose_3ds").forEach((frame, index) => {
        const points = posePoints(frame, 3);
        if (points.length < 17) return;
        frames.push(points);
        visibleFrames.push(pose3DVisibilityFromPose2DFrame(pose2Ds[index]));
      });
      return { frames, visibleFrames };
    }
    const SAME_PERSON_THRESHOLD = 0.7;
    const WHITE_POSTER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='white'/%3E%3C/svg%3E";

    function t(key, vars = {}) {
      const table = i18n[state.locale] || i18n["zh-CN"];
      const fallback = Object.prototype.hasOwnProperty.call(i18n["zh-CN"], key) ? i18n["zh-CN"][key] : key;
      const value = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : fallback;
      return String(value).replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? "");
    }

    async function fetchJSONIfAvailable(url) {
      try {
        const response = await fetch(url, { cache: "no-cache" });
        if (!response.ok) return null;
        return await response.json();
      } catch (_) {
        return null;
      }
    }

        source: "demo-pose",
        frameCount: Number(seq.frames || 0),

    async function loadExampleManifests() {
      const pose = await fetchJSONIfAvailable("/portal/examples/pose-demo/manifest.json");
      if (pose && Array.isArray(pose.videos)) {
        state.examples.pose.videos = pose.videos.map((video, index) => {
          const id = String(video.id || `pose-video-${index + 1}`);
          const sequences = (Array.isArray(video.sequences) ? video.sequences : []).map((seq, seqIndex) => normalizeDemoPoseSequence(seq, seqIndex, id));
          return {
            id,
            label: String(video.label || `${t("video")} ${index + 1}`),
            sourceVideo: String(video.source_video || ""),
            thumbURL: (sequences[0] || {}).thumbURL || "",
            sequences,
          };
        });
        state.examples.pose.selectedVideo = (state.examples.pose.videos[0] || {}).id || "";
      }
      const gait = await fetchJSONIfAvailable("/portal/examples/gait-demo/manifest.json");
      if (gait) {
        const normalizeVideo = (video, index, group) => {
          const id = String(video.id || `${group}-${index + 1}`);
          const sequences = (Array.isArray(video.sequences) ? video.sequences : []).map((seq, seqIndex) => normalizeDemoGaitSequence(seq, seqIndex, id, group));
          return {
            id,
            label: String(video.label || `${group === "video1" ? t("video1") : t("video2")} ${index + 1}`),
            sourceVideo: String(video.source_video || ""),
            thumbURL: (sequences[0] || {}).thumbURL || "",
            sequences,
          };
        };
        state.examples.gait.video1 = (Array.isArray(gait.video1_examples) ? gait.video1_examples : []).map((video, index) => normalizeVideo(video, index, "video1"));
        state.examples.gait.video2 = (Array.isArray(gait.video2_examples) ? gait.video2_examples : []).map((video, index) => normalizeVideo(video, index, "video2"));
        if (!state.examples.gait.video1.length && gait.video1) state.examples.gait.video1 = [normalizeVideo(gait.video1, 0, "video1")];
        if (!state.examples.gait.video2.length && gait.video2) state.examples.gait.video2 = [normalizeVideo(gait.video2, 0, "video2")];
        state.examples.gait.selectedVideo1 = (state.examples.gait.video1[0] || {}).id || "";
        state.examples.gait.selectedVideo2 = (state.examples.gait.video2[0] || {}).id || "";
        state.examples.gait.comparisons = Array.isArray(gait.comparisons) ? gait.comparisons : [];
      }
      renderExampleVideos();
    }

    function clampInteger(value, fallback, min, max) {
      value = Number.parseInt(value, 10);
      if (!Number.isFinite(value)) value = fallback;
      value = Math.max(min, Math.min(max, value));
      return value;
    }

    function defaultBrowserSettings(kind) {
      return kind === "gait"
        ? { frameJump: 3, minBoxWidth: 64, minBoxHeight: 128, minFrames: 20, maxFrames: 500, keepStatic: false }
        : { frameJump: 1, minBoxWidth: 64, minBoxHeight: 128, minFrames: 20, maxFrames: 500, keepStatic: true };
    }

    function normalizeBrowserSettings(value, fallback) {
      const source = value && typeof value === "object" ? value : {};
      const base = fallback || defaultBrowserSettings("pose");
      const minFrames = clampInteger(source.minFrames ?? source.min_frames, base.minFrames, 1, 10000);
      return {
        frameJump: clampInteger(source.frameJump ?? source.frame_jump, base.frameJump, 1, 30),
        minBoxWidth: clampInteger(source.minBoxWidth ?? source.min_box_width, base.minBoxWidth, 1, 4096),
        minBoxHeight: clampInteger(source.minBoxHeight ?? source.min_box_height, base.minBoxHeight, 1, 4096),
        minFrames,
        maxFrames: Math.max(minFrames, clampInteger(source.maxFrames ?? source.max_frames, base.maxFrames, 1, 10000)),
        keepStatic: Boolean(source.keepStatic ?? source.keep_static ?? base.keepStatic),
      };
    }

    function activeSettingsKind() {
      return state.mode === "pose" ? "pose" : "gait";
    }

    function activeBrowserSettings() {
      return activeSettingsKind() === "pose" ? state.poseSettings : state.gaitSettings;
    }

    function browserSettingsPayload(settings) {
      const source = settings || activeBrowserSettings();
      return {
        frame_jump: source.frameJump,
        min_box_width: source.minBoxWidth,
        min_box_height: source.minBoxHeight,
        min_frames: source.minFrames,
        max_frames: source.maxFrames,
        keep_static: source.keepStatic,
      };
    }

      if (!$("settingFrameJump")) return;
      const settings = activeBrowserSettings();
      $("settingFrameJump").value = String(settings.frameJump);
      $("settingMinBoxWidth").value = String(settings.minBoxWidth);
      $("settingMinBoxHeight").value = String(settings.minBoxHeight);
      $("settingMinFrames").value = String(settings.minFrames);
      $("settingMaxFrames").value = String(settings.maxFrames);
      $("settingKeepStatic").value = settings.keepStatic ? "yes" : "no";
      $("cacheDirLabel").textContent = cacheDirDisplayName();
      $("cacheDirLabel").title = cacheDirDisplayName();
    }

    function readSettingsForm() {
      const settings = normalizeBrowserSettings({
        frameJump: $("settingFrameJump").value,
        minBoxWidth: $("settingMinBoxWidth").value,
        minBoxHeight: $("settingMinBoxHeight").value,
        minFrames: $("settingMinFrames").value,
        maxFrames: $("settingMaxFrames").value,
        keepStatic: $("settingKeepStatic").value === "yes",
      }, defaultBrowserSettings(activeSettingsKind()));
      if (activeSettingsKind() === "pose") state.poseSettings = settings;
      else state.gaitSettings = settings;
      updateSettingsForm();
      return settings;
    }

    function openCacheDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("w-agent-browser-cache", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("handles");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function cacheDBGet(key) {
      const db = await openCacheDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction("handles", "readonly").objectStore("handles").get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function cacheDBSet(key, value) {
      const db = await openCacheDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction("handles", "readwrite").objectStore("handles").put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function ensureCachePermission(handle, write = false) {
      if (!handle) return false;
      const opts = write ? { mode: "readwrite" } : {};
      if ((await handle.queryPermission(opts)) === "granted") return true;
      return (await handle.requestPermission(opts)) === "granted";
    }

    async function chooseCacheDirectory() {
      if (!state.cache.supported) {
        updateCacheStatus(t("cacheUnsupported"));
        return;
      }
      const dir = await window.showDirectoryPicker({ mode: "readwrite" });
      if (!(await ensureCachePermission(dir, true))) return;
      state.cache.dir = dir;
      state.cache.ready = true;
      await cacheDBSet("cacheDir", dir);
      updateCacheStatus(t("cacheSet", { dir: cacheDirDisplayName() }));
      await loadAPIKeyConfig();
      await saveAPIKeyConfig();
      updateSettingsForm();
    }

    async function initCacheDirectory() {
      await loadAPIKeyConfig();
      if (!state.cache.supported) {
        updateCacheStatus(t("cacheUnsupported"));
        return;
      }
      try {
        const dir = await cacheDBGet("cacheDir");
        if (dir && await ensureCachePermission(dir, true)) {
          state.cache.dir = dir;
          state.cache.ready = true;
          updateCacheStatus(t("cacheRestored", { dir: cacheDirDisplayName() }));
          await loadAPIKeyConfig();
          return;
        }
      } catch (_) {}
      updateCacheStatus(t("cacheUnset"));
    }

    async function cacheSubdir(parts) {
      if (!state.cache.ready || !state.cache.dir) return null;
      let dir = state.cache.dir;
      for (const part of parts) {
        dir = await dir.getDirectoryHandle(String(part).replace(/[^a-zA-Z0-9_.-]/g, "_"), { create: true });
      }
      return dir;
    }

    async function writeCacheFile(dir, name, body) {
      if (!dir) return;
      const handle = await dir.getFileHandle(name, { create: true });
      const writable = await handle.createWritable();
      await writable.write(body);
      await writable.close();
      return handle;
    }

    async function readCacheTextFile(dir, name) {
      if (!dir) return "";
      const handle = await dir.getFileHandle(name);
      const file = await handle.getFile();
      return file.text();
    }

    function apiKeyConfigPayload() {
      return JSON.stringify({
        api_key: apiKey(),
        api_mode: state.apiMode,
        pose_settings: browserSettingsPayload(state.poseSettings),
        gait_settings: browserSettingsPayload(state.gaitSettings),
        browser_settings: browserSettingsPayload(state.gaitSettings),
        updated_at: new Date().toISOString(),
      }, null, 2);
    }

    async function loadAPIKeyConfig() {
      let key = "";
      let settings = null;
      let poseSettings = null;
      let gaitSettings = null;
      let apiMode = "";
      try {
        key = localStorage.getItem("wAgentAPIKey") || "";
        apiMode = localStorage.getItem("wAgentAPIMode") || "";
        settings = JSON.parse(localStorage.getItem("wAgentBrowserSettings") || "null");
        poseSettings = JSON.parse(localStorage.getItem("wAgentPoseSettings") || "null");
        gaitSettings = JSON.parse(localStorage.getItem("wAgentGaitSettings") || "null");
      } catch (_) {}
      if (state.cache.ready && state.cache.dir) {
        try {
          const text = await readCacheTextFile(state.cache.dir, "w_agent.json");
          const config = JSON.parse(text || "{}");
          key = String(config.api_key || config.apiKey || key || "");
          apiMode = String(config.api_mode || config.apiMode || apiMode || "");
          settings = config.browser_settings || config.browserSettings || settings;
          poseSettings = config.pose_settings || config.poseSettings || poseSettings;
          gaitSettings = config.gait_settings || config.gaitSettings || gaitSettings;
        } catch (_) {}
      }
      state.poseSettings = normalizeBrowserSettings(poseSettings || settings || state.poseSettings, defaultBrowserSettings("pose"));
      state.gaitSettings = normalizeBrowserSettings(gaitSettings || settings || state.gaitSettings, defaultBrowserSettings("gait"));
      if (apiMode === "manual" || apiMode === "auto") {
        setAPIMode(apiMode, { skipSave: true });
      }
      if (key && !$("apiKey").value.trim()) {
        $("apiKey").value = key;
      }
      updateSettingsForm();
    }

    async function saveAPIKeyConfig() {
      const key = apiKey();
      try {
        if (key) localStorage.setItem("wAgentAPIKey", key);
        else localStorage.removeItem("wAgentAPIKey");
        localStorage.setItem("wAgentAPIMode", state.apiMode);
        localStorage.setItem("wAgentPoseSettings", JSON.stringify(browserSettingsPayload(state.poseSettings)));
        localStorage.setItem("wAgentGaitSettings", JSON.stringify(browserSettingsPayload(state.gaitSettings)));
        localStorage.setItem("wAgentBrowserSettings", JSON.stringify(browserSettingsPayload(state.gaitSettings)));
      } catch (_) {}
      if (state.cache.ready && state.cache.dir) {
        await writeCacheFile(state.cache.dir, "w_agent.json", apiKeyConfigPayload());
      }
    }

    async function saveBrowserSettings() {
      readSettingsForm();
      await saveAPIKeyConfig();
      updateCacheStatus(state.cache.ready ? t("cacheSet", { dir: cacheDirDisplayName() }) : t("cacheUnset"));
    }

    function setAPIMode(value, options = {}) {
      state.apiMode = value === "auto" ? "auto" : "manual";
      document.querySelectorAll("[data-api-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.apiMode === state.apiMode);
      });

        state.pose.sequences.forEach((seq) => prefetchPoseSequence(seq));
        state.gait.seq1.forEach((seq) => prefetchGaitSequence(seq, state.gait.seq1));
        state.gait.seq2.forEach((seq) => prefetchGaitSequence(seq, state.gait.seq2));

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function baseURL() {
      if (location.protocol === "file:") return "https://www.w-agent.cn/api";
      const path = location.pathname.startsWith("/api/") ? "/api" : "";
      return location.origin + path;
    }

    function browserFingerprint() {
      return btoa(unescape(encodeURIComponent([
        navigator.userAgent || "",
        navigator.language || "",
        screen.width + "x" + screen.height,
        new Date().getTimezoneOffset(),
      ].join("|")))).slice(0, 64);
    }

    function identity() {
      return $("identity").value;
    }

    function apiKey() {
      return $("apiKey").value.trim();
    }

    function selectUsableAPIKey(items) {
      const usable = (Array.isArray(items) ? items : []).filter((item) => {
        const secret = String(item?.secret || item?.key || "").trim();
        return secret && item?.status === "active";
      });
      return usable.find((item) => String(item?.name || "").toLowerCase() === "default") || usable[0] || null;
    }

    function accountDisplayName(user) {
      user = user || {};
      return String(user.email || user.phone || user.name || user.user_id || "").trim();
    }

    async function loadSessionAPIKey() {
      if (location.protocol === "file:") return "";
      if (state.sessionAPIKey) return state.sessionAPIKey;
      if (state.sessionAPIKeyPromise) return state.sessionAPIKeyPromise;
      state.sessionAPIKeyPromise = Promise.all([
        requestGET("/v1/me").catch(() => null),
        requestGET("/v1/me/api-keys").catch(() => null),
      ])
        .then(([me, keys]) => {
          state.sessionUser = me?.user || null;
          const selected = selectUsableAPIKey(keys?.items || keys?.api_keys);
          state.sessionAPIKey = String(selected?.secret || selected?.key || "").trim();
          updateLoginStatusLink();
          return state.sessionAPIKey;
        })
        .catch(() => {
          state.sessionAPIKey = "";
          state.sessionUser = null;
          updateLoginStatusLink();
          return "";
        })
        .finally(() => {
          state.sessionAPIKeyPromise = null;
        });
      return state.sessionAPIKeyPromise;
    }

    async function registeredAPIKey() {
      return await loadSessionAPIKey();
    }

    async function callCredentials() {
      const key = await registeredAPIKey();
      return key ? { identity: "registered", key } : { identity: "trial", key: "" };
    }

    async function requestAPI(method, path, body, key = "", extraHeaders = {}) {
      const headers = { "Content-Type": "application/json", ...extraHeaders };
      if (key) headers.Authorization = "Bearer " + key;
      const init = { method, headers, credentials: "same-origin" };
      if (body !== undefined && body !== null) init.body = JSON.stringify(body);
      const resp = await fetch(baseURL() + path, init);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const err = data?.error || {};
        const error = new Error(err.message || err.code || t("apiFailed"));
        error.status = resp.status;
        error.code = err.code || "";
        error.body = data;
        throw error;
      }
      return data;
    }

    async function requestJSON(path, body, key = "") {
      return requestAPI("POST", path, body, key);
    }

    async function requestMultipart(path, formData, key = "", extraHeaders = {}) {
      const headers = { ...extraHeaders };
      if (key) headers.Authorization = "Bearer " + key;
      const resp = await fetch(baseURL() + path, {
        method: "POST",
        headers,
        credentials: "same-origin",
        body: formData,
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const err = data?.error || {};
        const error = new Error(err.message || err.code || t("apiFailed"));
        error.status = resp.status;
        error.code = err.code || "";
        error.body = data;
        throw error;
      }
      return data;
    }

    async function requestGET(path, key = "") {
      return requestAPI("GET", path, null, key);
    }

    async function loadPricingPolicy() {
      if (state.pricing) return state.pricing;
      if (state.pricingPromise) return state.pricingPromise;
      state.pricingPromise = requestGET("/v1/public/pricing")
        .then((data) => {
          state.pricing = data?.pricing || {};
          return state.pricing;
        })
        .catch(() => {
          state.pricing = {};
          return state.pricing;
        })
        .finally(() => {
          state.pricingPromise = null;
        });
      return state.pricingPromise;
    }

    function pricingValue(key, fallback = 0) {
      const value = Number((state.pricing || {})[key]);
      return Number.isFinite(value) && value >= 0 ? value : fallback;
    }

    function sequenceFrameChargeAmount(frameCount) {
      const rate = pricingValue("sequence_per_k_frames", 0);
      if (rate <= 0) return 0;
      const frames = Math.max(1, Math.ceil(Number(frameCount || 0)));
      const billableFrames = Math.ceil(frames / 100) * 100;
      return Math.ceil((rate * billableFrames) / 1000);
    }

    function sequenceChargeAmount(kind, count, frameCount = 0) {
      const sequenceCount = Math.max(0, Number(count || 0));
      const baseRate = kind === "pose"
        ? pricingValue("gait_pose_per_sequence", 1)
        : pricingValue("sequence_per_sequence", 1);
      return (sequenceCount * baseRate) + sequenceFrameChargeAmount(frameCount);
    }

    function moneyText(amount) {
      return "¥" + (Number(amount || 0) / 100).toFixed(2);
    }

    function yuanText(amount) {
      return (Number(amount || 0) / 100).toFixed(2) + "元";
    }

    function chargeStatusTarget(kind) {
      return kind === "pose" ? setPoseAPIStatus : setStatus;
    }

    async function showChargeNotice(kind, count, requireConfirm, frameCount = 0) {
      if (state.chargeBatchActive) return true;
      await loadPricingPolicy();
      const amount = sequenceChargeAmount(kind, count, frameCount);
      const sequenceCount = Math.max(0, Number(count || 0));
      const message = requireConfirm
        ? await manualChargeNotice(kind, sequenceCount, amount)
        : t(requireConfirm ? "chargeConfirm" : "chargeAuto", {
        count: sequenceCount,
        amount: moneyText(amount),
      });
      if (!requireConfirm) {
        chargeStatusTarget(kind)(message);
        return true;
      }
      return showConfirmNoticeHTML(t("confirm"), escapeHTML(message));
    }

    async function manualChargeNotice(kind, count, amount) {
      const credentials = await callCredentials();
      if (credentials.identity === "trial") {
        const remainingBefore = Number(state.trialRemainingAmount);
        const remainingAfter = Number.isFinite(remainingBefore) ? Math.max(0, remainingBefore - amount) : NaN;
        return t("manualChargeTrial", {
          count,
          amount: yuanText(amount),
          remaining: Number.isFinite(remainingAfter) ? moneyText(remainingAfter) : "--",
        });
      }
      const status = await requestGET("/v1/api-keys/current/status", credentials.key);
      const remainingBefore = Number(status.wallet_balance || 0) + Number(status.monthly_balance || 0);
      const remainingAfter = Math.max(0, remainingBefore - amount);
      return t("poseManualChargeRegistered", { amount: yuanText(amount), remaining: yuanText(remainingAfter) });
    }

    function chargeResultMessage(result) {
      const trial = result?.trial;
      if (trial) {
        return t("chargeDoneTrial", {
          amount: moneyText(Number(trial.amount ?? 0)),
          remaining: moneyText(Number(trial.remaining_amount ?? 0)),
        });
      }
      const billing = result?.billing || result?.result?.billing || {};
      const amount = Number(billing.charge_amount ?? billing.amount ?? 0);
      if (Number.isFinite(amount) && amount > 0) {
        return t("chargeDoneRegistered", { amount: moneyText(amount) });
      }
      return "";
    }

    function resetChargeBatchSummary(kind) {
      state.chargeBatchSummary = { kind, count: 0, amount: 0, trial: false, remaining: NaN };
    }

    function addChargeBatchResult(kind, result, frameCount = 0) {
      if (!state.chargeBatchSummary) resetChargeBatchSummary(kind);
      const info = updateKnownChargeState(result);
      state.chargeBatchSummary.count += 1;
      state.chargeBatchSummary.amount += Number.isFinite(info.amount) && info.amount > 0 ? info.amount : sequenceChargeAmount(kind, 1, frameCount);
      if (info.trial) state.chargeBatchSummary.trial = true;
      if (Number.isFinite(info.remaining)) state.chargeBatchSummary.remaining = info.remaining;
    }

    function chargeBatchResultMessage() {
      const summary = state.chargeBatchSummary;
      if (!summary || !summary.count) return "";
      if (summary.trial) {
        return t("chargeDoneTrial", {
          amount: moneyText(summary.amount),
          remaining: Number.isFinite(summary.remaining) ? moneyText(summary.remaining) : "--",
        });
      }
      return t("chargeDoneRegistered", { amount: moneyText(summary.amount) });
    }

    function chargeBatchResultMessageHTML() {
      const message = chargeBatchResultMessage();
      if (!message) return "";
      const summary = state.chargeBatchSummary;
      return summary && summary.trial ? escapeHTML(message) + " " + moreQuotaHintHTML() : escapeHTML(message);
    }

    function chargeResultInfo(result) {
      const trial = result?.trial;
      if (trial) {
        return {
          amount: Number(trial.amount ?? 0),
          remaining: Number(trial.remaining_amount ?? NaN),
          trial: true,
        };
      }
      const billing = result?.billing || result?.result?.billing || {};
      return {
        amount: Number(billing.charge_amount ?? billing.amount ?? 0),
        remaining: NaN,
        trial: false,
      };
    }

    function updateKnownChargeState(result) {
      const info = chargeResultInfo(result);
      if (info.trial && Number.isFinite(info.remaining)) {
        state.trialRemainingAmount = info.remaining;
      }
      return info;
    }

    function resetPoseAutoCharge() {
      state.pose.autoExtractDone = false;
      state.pose.autoCharge = { count: 0, amount: 0, trial: false, remaining: NaN };
    }

    function addPoseAutoCharge(result, frameCount = 0) {
      if (!state.pose.autoCharge) resetPoseAutoCharge();
      const info = updateKnownChargeState(result);
      state.pose.autoCharge.count += 1;
      state.pose.autoCharge.amount += Number.isFinite(info.amount) && info.amount > 0 ? info.amount : sequenceChargeAmount("pose", 1, frameCount);
      if (info.trial) state.pose.autoCharge.trial = true;
      if (Number.isFinite(info.remaining)) state.pose.autoCharge.remaining = info.remaining;
    }

    function resetGaitAutoCharge() {
      state.gait.autoCharge = {
        video1: { count: 0, amount: 0, trial: false, remaining: NaN },
        video2: { count: 0, amount: 0, trial: false, remaining: NaN },
      };
    }

    function addGaitAutoCharge(group, result, frameCount = 0) {
      if (!state.gait.autoCharge) resetGaitAutoCharge();
      const bucket = state.gait.autoCharge[group];
      if (!bucket) return;
      const info = updateKnownChargeState(result);
      bucket.count += 1;
      bucket.amount += Number.isFinite(info.amount) && info.amount > 0 ? info.amount : sequenceChargeAmount("sequence", 1, frameCount);
      if (info.trial) bucket.trial = true;
      if (Number.isFinite(info.remaining)) bucket.remaining = info.remaining;
    }

    function gaitChargeSuffix(group) {
      if (state.apiMode !== "auto" || !state.gait.autoCharge) return "";
      const bucket = state.gait.autoCharge[group];
      if (!bucket || !bucket.count) return "";
      return t("gaitChargeSuffix", { amount: moneyText(bucket.amount) });
    }

    function gaitChargeSuffixHTML(group) {
      const text = gaitChargeSuffix(group);
      return text ? escapeHTML(text) : "";
    }

    function gaitTrialRemainingSummaryHTML() {
      if (state.apiMode !== "auto" || !state.gait.autoCharge) return "";
      const buckets = [state.gait.autoCharge.video1, state.gait.autoCharge.video2].filter(Boolean);
      const remainingValues = buckets
        .filter((bucket) => bucket.trial && Number.isFinite(bucket.remaining))
        .map((bucket) => bucket.remaining);
      if (!remainingValues.length) return "";
      const remaining = Math.min(...remainingValues);
      const line = t("gaitTrialRemainingLine", { remaining: moneyText(remaining) });
      return escapeHTML(line) + " " + moreQuotaHintHTML();
    }

    function maybeShowPoseAutoChargeSummary() {
      if (state.apiMode !== "auto" || !state.pose.autoExtractDone || state.pose.pendingCalls > 0) return;
      const summary = state.pose.autoCharge;
      if (!summary || !summary.count) {
        setPoseAPIStatus(t("poseAutoDone"), "ok");
        return;
      }
      const key = summary.trial && Number.isFinite(summary.remaining) ? "poseAutoChargeDoneTrial" : "poseAutoChargeDone";
      const message = t(key, {
        count: summary.count,
        amount: moneyText(summary.amount),
        remaining: moneyText(summary.remaining),
      });
      if (summary.trial && Number.isFinite(summary.remaining)) {
        setPoseAPIStatusHTML(escapeHTML(message) + " " + moreQuotaHintHTML(), "ok");
      } else {
        setPoseAPIStatus(message, "ok");
      }
    }

    function chargeErrorMessage(error, fallbackKind, count) {
      const detail = error?.body?.error?.details || {};
      syncTrialRemainingFromDetails(detail);
      if (isTrialQuotaExceeded(error, detail)) {
        return t("trialQuotaInsufficient");
      }
      const hasAvailableAmount = Object.prototype.hasOwnProperty.call(detail, "available_amount");
      const amount = Number(detail.required_amount ?? sequenceChargeAmount(fallbackKind, count));
      const remaining = Number(detail.available_amount ?? 0);
      if (error?.code === "wallet_insufficient_balance" || hasAvailableAmount) {
        return t("chargeInsufficient", { amount: moneyText(amount), remaining: moneyText(remaining) });
      }
      return "";
    }

    function chargeErrorMessageHTML(error, fallbackKind, count) {
      const message = chargeErrorMessage(error, fallbackKind, count);
      if (!message) return "";
      if (isTrialQuotaMessage(message)) return trialQuotaInsufficientHTML();
      const detail = error?.body?.error?.details || {};
      const hasAvailableAmount = Object.prototype.hasOwnProperty.call(detail, "available_amount");
      if (error?.code === "wallet_insufficient_balance" || hasAvailableAmount) {
        const escaped = escapeHTML(message);
        const linkText = escapeHTML(t("chargeTopUpLink"));
        return escaped.replace(linkText, topUpLinkHTML());
      }
      return escapeHTML(message);
    }

    function syncTrialRemainingFromDetails(detail) {
      const trial = detail?.trial || detail?.trial_usage || {};
      const remaining = Number(trial.remaining_amount ?? detail?.remaining_amount ?? NaN);
      if (Number.isFinite(remaining)) state.trialRemainingAmount = remaining;
    }

    function isTrialQuotaExceeded(error, detail = {}) {
      const trial = detail?.trial || detail?.trial_usage || {};
      const reason = String(trial.reason || detail.reason || "");
      const text = [
        error?.code,
        error?.message,
        reason,
        JSON.stringify(detail || {}),
      ].join(" ");
      return /trial_limit_exceeded|total_amount_limit_exceeded/i.test(text);
    }

    async function framesForAPI(frames) {
      const out = [];
      for (let index = 0; index < (frames || []).length; index += 1) {
        const frame = frames[index];
        const content = await frameBase64(frame);
        if (!content) continue;
        out.push({
          index,
          frame_id: frame?.frame_id ?? frame?.image_id ?? frame?.id ?? index + 1,
          time: frame?.time,
          score: frame?.score,
          det: frame?.det,
          crop: frame?.crop,
          content_base64: content,
        });
      }
      return out;
    }

    async function runSequenceAPI(kind, frames, options = {}) {
      const credentials = await callCredentials();
      if (!options.silentCharge) {
        const confirmed = await showChargeNotice(kind, 1, state.apiMode === "manual", (frames || []).length);
        if (!confirmed) {
          const error = new Error("");
          error.cancelled = true;
          throw error;
        }
      }
      const apiFrames = await framesForAPI(frames);
      try {
        let data;
        if (credentials.identity === "trial") {
          const created = await requestJSON("/v1/public/sequences", { frame_count: apiFrames.length });
          const taskToken = String(created?.task_token || "");
          const uploadToken = uploadTokenFromUploadURL(created?.uploads?.[0]?.upload_url);
          if (!taskToken) throw new Error("task_token missing");
          if (!uploadToken) throw new Error("upload_token missing");
          await uploadFramesBatch(created.task_id, uploadToken, apiFrames, "", { "X-Task-Token": taskToken });
          const uploadedFrames = (created.uploads || []).map((upload) => ({
            index: upload.index,
            object_key: upload.object_key,
          }));
          const path = kind === "pose" ? `/v1/public/trial/sequences/${created.task_id}/gait-pose` : `/v1/public/trial/sequences/${created.task_id}/parse`;
          data = await requestAPI("POST", path, { frames: uploadedFrames, fingerprint: browserFingerprint() }, "", { "X-Task-Token": taskToken });
        } else {
          const created = await requestJSON("/v1/sequences", { frame_count: apiFrames.length }, credentials.key);
          const uploadToken = uploadTokenFromUploadURL(created?.uploads?.[0]?.upload_url);
          if (!uploadToken) throw new Error("upload_token missing");
          await uploadFramesBatch(created.task_id, uploadToken, apiFrames, credentials.key);
          const uploadedFrames = (created.uploads || []).map((upload) => ({
            index: upload.index,
            object_key: upload.object_key,
          }));
          const path = kind === "pose" ? `/v1/sequences/${created.task_id}/gait-pose` : `/v1/sequences/${created.task_id}/parse`;
          data = await requestJSON(path, { frames: uploadedFrames }, credentials.key);
        }
        updateKnownChargeState(data);
        if (state.chargeBatchActive) addChargeBatchResult(kind, data, apiFrames.length);
        const doneMessageHTML = options.silentCharge || state.chargeBatchActive ? "" : chargeResultMessageHTML(data);
        if (doneMessageHTML) {
          if (kind === "pose") setPoseAPIStatusHTML(doneMessageHTML, "ok");
          else setStatusHTML(doneMessageHTML, "ok");
        }
        return data;
      } catch (error) {
        const chargeMessage = chargeErrorMessage(error, kind, 1);
        if (chargeMessage) {
          const chargeMessageHTML = chargeErrorMessageHTML(error, kind, 1);
          setChargeStatusHTML(kind, chargeMessageHTML, "error");
          error.chargeMessageHTML = chargeMessageHTML;
          error.message = chargeMessage;
        }
        throw error;
      }
    }

    function dataURLBase64(dataURL) {
      return String(dataURL).split(",", 2)[1] || "";
    }

    function base64ToBlob(base64, type = "image/jpeg") {
      const binary = atob(base64 || "");
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error(t("readFileFailed")));
        reader.readAsDataURL(file);
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(dataURLBase64(String(reader.result || "")));
        reader.onerror = () => reject(reader.error || new Error(t("readFileFailed")));
        reader.readAsDataURL(blob);
      });
    }

    async function readFileHandleAsBase64(handle) {
      if (!handle) return "";
      const file = await handle.getFile();
      return dataURLBase64(await readFileAsDataURL(file));
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(t("imageLoadFailed")));
        image.src = src;
      });
    }

    async function frameBase64(frame) {
      if (frame?.cacheHandle) return readFileHandleAsBase64(frame.cacheHandle);
      if (frame?.content_blob instanceof Blob) return blobToBase64(frame.content_blob);
      if (frame?.blob instanceof Blob) return blobToBase64(frame.blob);
      return frame?.content_base64 || frame?.image_base64 || frame?.base64 || "";
    }

    function framePreviewBase64(frame) {
      return frame?.preview_base64 || frame?.content_base64 || frame?.image_base64 || frame?.base64 || "";
    }

    function frameID(frame, index) {
      return String(frame?.frame_id ?? frame?.image_id ?? frame?.id ?? index + 1);
    }

    async function frameBlob(frame) {
      if (frame?.content_blob instanceof Blob) return frame.content_blob;
      if (frame?.blob instanceof Blob) return frame.blob;
      if (frame?.cacheHandle) return await frame.cacheHandle.getFile();
      const content = await frameBase64(frame);
      if (!content) return null;
      return base64ToBlob(content, "image/jpeg");
    }

    function uploadTokenFromUploadURL(uploadURL) {
      try {
        const parsed = new URL(String(uploadURL || ""), window.location.origin);
        return parsed.searchParams.get("token") || "";
      } catch {
        return "";
      }
    }

    async function uploadFramesBatch(taskID, uploadToken, frames, key = "", extraHeaders = {}) {
      const form = new FormData();
      form.append("upload_token", uploadToken);
      for (let index = 0; index < frames.length; index += 1) {
        const blob = await frameBlob(frames[index]);
        if (!blob) continue;
        form.append("frames", blob, `${String(index).padStart(6, "0")}.jpg`);
      }
      const prefix = extraHeaders["X-Task-Token"] ? "/v1/public/sequences" : "/v1/sequences";
      return requestMultipart(`${prefix}/${taskID}/uploads/batch`, form, key, extraHeaders);
    }

    function frameAliases(frame, index) {
      const aliases = new Set();
      const add = (value) => {
        if (value === undefined || value === null || value === "") return;
        const text = String(value);
        aliases.add(text);
        const numeric = Number(text);
        if (Number.isFinite(numeric)) {
          aliases.add(String(numeric));
          aliases.add(String(Math.trunc(numeric)).padStart(6, "0"));
        }
      };
      add(frame?.frame_id);
      add(frame?.image_id);
      add(frame?.id);
      add(index + 1);
      return aliases;
    }

    function previewBase64(seq) {
      if (seq?.preview_base64) return seq.preview_base64;
      const frames = seq.frames || [];
      const frame = frames[Math.floor(Math.max(0, frames.length - 1) / 2)] || frames[0];
      return framePreviewBase64(frame) || framePreviewBase64(frames.find((item) => framePreviewBase64(item)));
    }

    async function ensureSequencePreview(seq) {
      if (!seq || seq.preview_base64) return;
      const frames = seq.frames || [];
      const frame = frames[Math.floor(Math.max(0, frames.length - 1) / 2)] || frames[0];
      if (!frame) return;
      const preview = framePreviewBase64(frame) || await frameBase64(frame);
      if (preview) {
        seq.preview_base64 = preview;
        if (!frame.preview_base64) frame.preview_base64 = preview;
      }
    }

    function sequencePayloads(apiResult) {
      if (Array.isArray(apiResult)) return apiResult;
      if (Array.isArray(apiResult?.sequences)) return apiResult.sequences;
      if (Array.isArray(apiResult?.result?.sequences)) return apiResult.result.sequences;
      const single = apiResult?.sequence || apiResult?.result?.sequence || apiResult?.result || apiResult;
      if (single && typeof single === "object") return [single];
      return [];
    }

    function numericVector(value) {
      return Array.isArray(value) ? value.filter((item) => typeof item === "number") : [];
    }

    function dotProduct(left, right) {
      const a = numericVector(left);
      const b = numericVector(right);
      if (!a.length || !b.length) return null;
      const used = Math.min(a.length, b.length);
      let score = 0;
      for (let i = 0; i < used; i += 1) score += a[i] * b[i];
      return score;
    }

    function scoreOrZero(value) {
      return typeof value === "number" && Number.isFinite(value) ? value : 0;
    }

    function featureSimilarity(left, right) {
      const gait = dotProduct(left.gait_feature, right.gait_feature);
      const reid = dotProduct(left.reid_feature, right.reid_feature);
      const face = dotProduct(left.face_feature, right.face_feature);
      const faceScore = scoreOrZero(face);
      let fused = Math.max(scoreOrZero(gait), 0);
      if (faceScore > 0.45) fused = Math.max(fused, 0.7);
      else if (faceScore > 0.35) fused *= 1.1;
      if (scoreOrZero(reid) > 0.8) fused *= 1.1;
      if (faceScore > 0.5) fused *= 1.1;
      return {
        score: Math.min(fused, 1),
        gait_similarity: gait,
        reid_similarity: reid,
        face_similarity: face,
        threshold: SAME_PERSON_THRESHOLD,
      };
    }

    function drawLocate(image, boxes = []) {
      const canvas = $("locateCanvas");
      const ctx = canvas.getContext("2d");
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      const scale = Math.min(1280 / width, 800 / height, 1);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      boxes.forEach((box, index) => {
        const x1 = Number(box.x1 ?? box.left ?? box[0] ?? 0) * scale;
        const y1 = Number(box.y1 ?? box.top ?? box[1] ?? 0) * scale;
        const x2 = Number(box.x2 ?? box.right ?? box[2] ?? x1) * scale;
        const y2 = Number(box.y2 ?? box.bottom ?? box[3] ?? y1) * scale;
        ctx.strokeStyle = "#0f62fe";
        ctx.lineWidth = 3;
        ctx.strokeRect(x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
        ctx.fillStyle = "#0f62fe";
        ctx.fillRect(x1, Math.max(0, y1 - 24), 96, 24);
        ctx.fillStyle = "#fff";
        ctx.font = "14px sans-serif";
        ctx.fillText(String(box.label || box.name || "result " + (index + 1)), x1 + 6, Math.max(16, y1 - 7));
      });
    }

    function extractBoxes(data) {
      const direct = data?.boxes || data?.result?.boxes || data?.objects || data?.result?.objects;
      if (Array.isArray(direct)) return direct;
      const frames = data?.sequence?.frames || data?.result?.frames || [];
      return frames.map((frame) => frame.rect || frame.box || frame).filter(Boolean);
    }

        throw new Error(t("persondetMissing"));
      }

    function isAbortError(error) {
      return error && (error.name === "AbortError" || /已停止|aborted|abort/i.test(error.message || ""));
    }

    async function removeCachedSequenceFrames(cacheID) {
      if (!state.cache.ready || !state.cache.dir || !cacheID || typeof state.cache.dir.removeEntry !== "function") return;
      try {
        const sequencesDir = await state.cache.dir.getDirectoryHandle("sequences");
        await sequencesDir.removeEntry(cacheID, { recursive: true });
      } catch (_) {}
    }

    function frameWritableBlob(frame) {
      const content = frame?.content_base64 || frame?.image_base64 || frame?.base64 || "";
      if (frame?.content_blob instanceof Blob) return frame.content_blob;
      if (frame?.blob instanceof Blob) return frame.blob;
      return content ? base64ToBlob(content, "image/jpeg") : null;
    }

    async function storeSequenceFrame(seq, index, frame, dir, previewIndex) {
      const content = frame?.content_base64 || frame?.image_base64 || frame?.base64 || "";
      const blob = frameWritableBlob(frame);
      if (!blob || frame.cacheHandle) return false;
      const name = `${String(index + 1).padStart(6, "0")}.jpg`;
      const handle = await writeCacheFile(dir, name, blob);
      frame.cacheFile = name;
      frame.cacheHandle = handle;
      const previewContent = (index === 0 || index === previewIndex) ? (content || await blobToBase64(blob)) : "";
      if (!seq.preview_base64 && index === previewIndex) seq.preview_base64 = previewContent;
      if (!frame.preview_base64 && (index === 0 || index === previewIndex)) {
        frame.preview_base64 = previewContent;
      }
      delete frame.content_base64;
      delete frame.image_base64;
      delete frame.base64;
      delete frame.content_blob;
      delete frame.blob;
      return true;
    }

    async function storeSequenceFrames(seq) {
      if (!state.cache.ready || !seq || seq.framesSaved) return seq;
      const frames = seq.frames || [];
      const previewIndex = Math.floor(Math.max(0, frames.length - 1) / 2);
      try {
        if (!frames.some((frame) => frameWritableBlob(frame) && !frame.cacheHandle)) {
          seq.framesSaved = frames.some((frame) => frame.cacheHandle);
          return seq;
        }
        const dir = await cacheSubdir(["sequences", sequenceCacheID(seq), "frames"]);
        for (let index = 0; index < frames.length; index += 1) {
          await storeSequenceFrame(seq, index, frames[index], dir, previewIndex);
        }
        if (!seq.preview_base64) {
          const previewFrame = frames.find((item) => framePreviewBase64(item));
          seq.preview_base64 = framePreviewBase64(previewFrame);
        }
        seq.framesSaved = true;
      } catch (error) {
        console.warn("[W-Agent] frame cache write failed:", error);
      }
      return seq;
    }

    async function extractVideoSequences(file, label, target, onProgress, config, signal) {
      if (onProgress) onProgress({ stage: "assets_loading" });
      await ensurePersonDet();
      if (!file) throw new Error(t("needVideo"));
      const sequences = Array.isArray(target) ? target : [];
      const minFrames = Math.max(1, Number(config?.minFrames || defaultBrowserSettings(label === "pose" ? "pose" : "gait").minFrames || 20));
      const streamingCache = new Map();
      const streamingCacheID = (seq) => sequenceCacheIDFromParts(label, seq?.seq_id || seq?.sequence_id || seq?.id || "sequence");
      const ensureStreamingCacheEntry = (seq) => {
        const id = streamingCacheID(seq);
        let entry = streamingCache.get(id);
        if (!entry) {
          entry = { id, active: false, dir: null, failed: false, nextIndex: 0, written: 0 };
          streamingCache.set(id, entry);
        }
        return entry;
      };
      const extracted = await window.WAgentPersonDet.extractLocalVideoSequence(file, {
        config: config || {},
        onFrame: async (seq, frame, index) => {
          if (!state.cache.ready || !seq || !Array.isArray(seq.frames)) return;
          const entry = ensureStreamingCacheEntry(seq);
          if (!entry || entry.failed) return;
          if (!entry.active && seq.frames.length < minFrames) return;
          try {
            if (!seq.frames.slice(entry.nextIndex).some((item) => frameWritableBlob(item) && !item.cacheHandle)) return;
            if (!entry.dir) entry.dir = await cacheSubdir(["sequences", entry.id, "frames"]);
            entry.active = true;
            const previewIndex = Math.floor(Math.max(0, seq.frames.length - 1) / 2);
            for (let i = entry.nextIndex; i < seq.frames.length; i += 1) {
              if (await storeSequenceFrame(seq, i, seq.frames[i], entry.dir, previewIndex)) entry.written += 1;
              entry.nextIndex = i + 1;
            }
          } catch (error) {
            entry.failed = true;
            await removeCachedSequenceFrames(entry.id);
            console.warn("[W-Agent] streaming frame cache write failed:", error);
          }
        },
        onDiscard: async (seq) => {
          const entry = streamingCache.get(streamingCacheID(seq));
          if (entry && (entry.active || entry.dir || entry.written > 0)) await removeCachedSequenceFrames(entry.id);
          if (seq && Array.isArray(seq.frames)) seq.frames = [];
        },
        signal,
        onSequence: async (seq) => {
          const item = normalizeLocalSequence(seq, label, sequences.length);
          await ensureSequencePreview(item);
          await storeSequenceFrames(item);
          const existingIndex = sequences.findIndex((entry) => entry.id === item.id);
          if (existingIndex >= 0) sequences[existingIndex] = { ...sequences[existingIndex], ...item };
          else sequences.push(item);
          if (onProgress) onProgress({ stage: "sequence", sequences, sequence: item });
          return item;
        },
        progress: (p) => {
          if (onProgress) onProgress(p);
        },
      });
      if (!sequences.length && Array.isArray(extracted?.sequences)) {
        for (const seq of extracted.sequences) {
          const item = normalizeLocalSequence(seq, label, sequences.length);
          await ensureSequencePreview(item);
          await storeSequenceFrames(item);
          sequences.push(item);
        }
      }
      return sequences;
    }

    function normalizeLocalSequence(seq, source, index) {
      const id = String(seq.sequence_id || seq.id || `${source}_${index + 1}`);
      return {
        id,
        source,
        trackID: seq.track_id || seq.trackId || "",
        frames: Array.isArray(seq.frames) ? seq.frames : [],
        sourceFrames: seq.source_frames || seq.uploaded_frames || (Array.isArray(seq.frames) ? seq.frames.length : 0),
        startTime: Number(seq.start_time ?? 0),
        endTime: Number(seq.end_time ?? seq.start_time ?? 0),
        feature: null,
        rawResult: null,
        status: "local",
        similarity: null,
      };
    }

    function sequenceCard(seq, index, selected, mode) {
      const img = previewBase64(seq);
      const thumbURL = seq?.thumbURL || "";
      const thumbHTML = img
        ? `<img src="data:image/jpeg;base64,${img}" alt="sequence ${index + 1}">`
        : (thumbURL ? `<img src="${escapeHTML(thumbURL)}" alt="sequence ${index + 1}">` : "");
      const frameCount = Array.isArray(seq.frames) && seq.frames.length ? seq.frames.length : Number(seq.frameCount || 0);
      const classes = ["sequence-card"];
      if (selected) classes.push("selected");
      if (seq.feature) classes.push("has-feature");
      if (seq.status === "loading") classes.push("loading-feature");
      if (seq.status === "invalid" || seq.status === "error") classes.push("invalid");
      const score = typeof seq.similarity === "number" ? `<span class="similarity">${Math.round(seq.similarity * 100)}%</span>` : "";
      const isPose = mode === "pose";
      const stateText = isPose
        ? (seq.poseStatus === "loading" ? t("poseStatusAPICalling")
          : seq.poseStatus === "rendering" ? t("poseStatusRendering")
          : seq.poseStatus === "error" ? t("poseStatusAPIFailed")
          : seq.status === "invalid" ? t("invalid") : "")
        : (seq.status === "loading" ? t("featureExtracting")
          : seq.status === "error" ? t("apiFailedStatus")
          : seq.status === "invalid" ? t("invalid") : "");
      const errorTitle = isPose
        ? (seq.poseStatus === "error" ? (seq.poseError || t("poseStatusAPIFailed")) : "")
        : (seq.status === "error" ? (seq.errorMessage || t("apiFailedStatus")) : "");
      return `
        <article class="${classes.join(" ")}" data-id="${escapeHTML(seq.id)}" data-mode="${escapeHTML(mode)}"${errorTitle ? ` title="${escapeHTML(errorTitle)}"` : ""}>
          <div class="sequence-thumb">${thumbHTML}</div>
          <div class="sequence-meta">
            <div class="sequence-line"><strong>${escapeHTML(t("sequenceLabel", { index: index + 1 }))}</strong><span>${escapeHTML(t("frameUnit", { count: frameCount }))}</span></div>
            ${score}
            ${stateText ? `<span>${escapeHTML(stateText)}</span>` : ""}
          </div>
        </article>`;
    }

    function renderPoseSequences() {
      $("poseSeqBadge").textContent = String(state.pose.sequences.length);
      if (!state.pose.sequences.length) {
        $("poseSeqList").innerHTML = "";
        return;
      }
      $("poseSeqList").innerHTML = state.pose.sequences.map((seq, index) =>
        sequenceCard(seq, index, state.pose.selected === seq.id, "pose")
      ).join("");
    }

    function renderGaitSequences() {
      $("gaitLeftBadge").textContent = String(state.gait.seq1.length);
      $("gaitRightBadge").textContent = String(state.gait.seq2.length);
      $("gaitSeq1List").innerHTML = state.gait.seq1.length
        ? state.gait.seq1.map((seq, index) => sequenceCard(seq, index, state.gait.selected1 === seq.id, "gait1")).join("")
        : "";
      const rightSequences = sortedGaitSeq2();
      const pageInfo = gaitSeq2PageInfo(rightSequences.length);
      state.gait.seq2Page = pageInfo.page;
      const visibleRightSequences = rightSequences.slice(pageInfo.start, pageInfo.end);
      $("gaitSeq2List").innerHTML = rightSequences.length
        ? visibleRightSequences.map((seq, index) => sequenceCard(seq, pageInfo.start + index, state.gait.selected2.includes(seq.id), "gait2")).join("")
        : "";
      $("gaitSelectAll").textContent = state.gait.seq2.length && state.gait.selected2.length === state.gait.seq2.length ? t("deselectAll") : t("selectAll");
      $("gaitSort").textContent = state.gait.sortMode === "similarity" ? t("sortSimilarity") : t("sortDefault");
      $("gaitPageBadge").textContent = `${pageInfo.page} / ${pageInfo.totalPages}`;
      $("gaitPager").classList.toggle("is-hidden", pageInfo.totalPages <= 1);
      $("gaitPagePrev").disabled = pageInfo.page <= 1;
      $("gaitPageNext").disabled = pageInfo.page >= pageInfo.totalPages;
      updateActionButtons();
    }

    function gaitTimeRange() {
      const max = Number(state.gait.video2Duration || 0);
      let start = Number($("gaitRangeStart")?.value || 0);
      let end = Number($("gaitRangeEnd")?.value || max || 0);
      if (!Number.isFinite(start) || start < 0) start = 0;
      if (!Number.isFinite(end) || end <= 0) end = max || 0;
      if (max > 0) {
        start = Math.min(start, max);
        end = Math.min(end, max);
      }
      if (end < start) {
        const tmp = start;
        start = end;
        end = tmp;
      }
      return { start, end };
    }

    function sequenceOverlapsTimeRange(seq, range) {
      if (!seq) return false;
      const start = Number(seq.startTime || 0);
      const end = Number(seq.endTime || start);
      if (!Number.isFinite(start) || !Number.isFinite(end)) return true;
      if (!Number.isFinite(range.end) || range.end <= 0) return true;
      return end >= range.start && start <= range.end;
    }

    function applyGaitTimeRange() {
      if (!state.gait.seq2All.length) return;
      const range = gaitTimeRange();
      state.gait.seq2 = state.gait.seq2All.filter((seq) => sequenceOverlapsTimeRange(seq, range));
      const validIDs = new Set(state.gait.seq2.map((seq) => seq.id));
      state.gait.selected2 = state.gait.selected2.filter((id) => validIDs.has(id));
      if (!state.gait.selected2.length) state.gait.selected2 = state.gait.seq2.map((seq) => seq.id);
      state.gait.seq2Page = 1;
      renderGaitSequences();
    }

    function setGaitVideo2Duration(duration) {
      state.gait.video2Duration = Number.isFinite(duration) && duration > 0 ? duration : 0;
      const end = $("gaitRangeEnd");
      if (end) {
        end.max = state.gait.video2Duration ? String(state.gait.video2Duration.toFixed(1)) : "";
        end.value = state.gait.video2Duration ? state.gait.video2Duration.toFixed(1) : "0";
      }
      const start = $("gaitRangeStart");
      if (start) {
        start.max = state.gait.video2Duration ? String(state.gait.video2Duration.toFixed(1)) : "";
        start.value = "0";
      }
    }

    function gaitFileToken(file) {
      if (!file) return "";
      return [file.name || "", file.size || 0, file.lastModified || 0, file.type || ""].join("|");
    }

    function gaitCurrentVideoParsed(group) {
      if (group === "video1") {
        if (state.gait.file1 && state.gait.file1.demo) return state.gait.parsed1Token === demoFileToken("gait1", state.examples.gait.selectedVideo1);
        return Boolean(state.gait.file1 && state.gait.parsed1Token === gaitFileToken(state.gait.file1));
      }
      if (state.gait.file2 && state.gait.file2.demo) return state.gait.parsed2Token === demoFileToken("gait2", state.examples.gait.selectedVideo2);
      return Boolean(state.gait.file2 && state.gait.parsed2Token === gaitFileToken(state.gait.file2));
    }

    function poseCurrentVideoParsed() {
      if (state.pose.file && state.pose.file.demo) return state.pose.parsedToken === demoFileToken("pose", state.examples.pose.selectedVideo);
      return Boolean(state.pose.file && state.pose.parsedToken === gaitFileToken(state.pose.file));
    }

    function clearPoseVideoState() {
      state.pose.parsedToken = "";
      state.pose.selected = "";
      state.pose.sequences = [];
      state.pose.pendingCalls = 0;
      state.pose.autoExtractDone = false;
      resetPoseAutoCharge();
      renderPoseSequences();
      setPoseParseStatus(t("poseParseWaitingUpload"));
      setPoseAPIStatus("");
    }

    function clearGaitVideoState(group) {
      if (group === "video1") {
        state.gait.parsed1Token = "";
        state.gait.seq1 = [];
        state.gait.selected1 = "";
      } else {
        state.gait.parsed2Token = "";
        state.gait.seq2 = [];
        state.gait.seq2All = [];
        state.gait.selected2 = [];
        state.gait.seq2Page = 1;
      }
      state.gait.sortMode = "similarity";
      state.gait.progress[group] = "";
      resetGaitAutoCharge();
      renderGaitSequences();
      updateActionButtons();
    }

    function readVideoDuration(file) {
      return new Promise((resolve) => {
        if (!file) {
          resolve(0);
          return;
        }
        const video = document.createElement("video");
        const url = URL.createObjectURL(file);
        video.preload = "metadata";
        video.onloadedmetadata = () => {
          const duration = Number(video.duration || 0);
          URL.revokeObjectURL(url);
          resolve(Number.isFinite(duration) ? duration : 0);
        };
        video.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(0);
        };
        video.src = url;
      });
    }

    function gaitSeq2PageInfo(total) {
      const perPage = gaitSeq2ItemsPerPage();
      const totalPages = Math.max(1, Math.ceil(total / perPage));
      const page = Math.max(1, Math.min(state.gait.seq2Page || 1, totalPages));
      const start = (page - 1) * perPage;
      return { page, totalPages, perPage, start, end: Math.min(total, start + perPage) };
    }

    function gaitSeq2ItemsPerPage() {
      const list = $("gaitSeq2List");
      const width = list ? list.clientWidth : 0;
      const minCardWidth = 116;
      const gap = 8;
      const columns = Math.max(1, Math.floor((width + gap) / (minCardWidth + gap)));
      return Math.max(1, columns * 4);
    }
