    function sortedGaitSeq2() {
      const list = state.gait.seq2.map((seq, index) => ({ seq, index }));
      if (state.gait.sortMode === "similarity") {
        list.sort((a, b) => {
          const av = typeof a.seq.similarity === "number" ? a.seq.similarity : -Infinity;
          const bv = typeof b.seq.similarity === "number" ? b.seq.similarity : -Infinity;
          if (bv !== av) return bv - av;
          return a.index - b.index;
        });
      }
      return list.map((item) => item.seq);
    }

    function renderGaitProgress(progress) {
      if (!progress.video1 && !progress.video2) return;
      const lines = [
        escapeHTML(t("gaitStatusLine", { video: t("video1"), progress: progress.video1 || "-" })) + gaitChargeSuffixHTML("video1"),
        escapeHTML(t("gaitStatusLine", { video: t("video2"), progress: progress.video2 || "-" })) + gaitChargeSuffixHTML("video2"),
        `${escapeHTML(t("batchCallUseAPI"))}<a href="https://www.w-agent.cn/portal?api=sequence#capabilities" target="_blank" rel="noopener">${escapeHTML(t("apiLinkText"))}</a>`,
      ];
      const trialSummary = gaitTrialRemainingSummaryHTML();
      if (trialSummary) lines.push(trialSummary);
      setStatusHTML(lines.map((line) => `<div>${line}</div>`).join(""));
    }

    function gaitProgressText(event, sequenceCount) {
      if (!event) return "";
      if (event.stage === "done") return t("gaitDonePart", { count: sequenceCount });
      const preparing = videoPreparingText(event);
      if (preparing) return preparing;
      if (!event.processed) return "";
      return t("gaitProgressPart", {
        current: event.current_frame || event.processed,
        total: event.total || t("unknown"),
        count: sequenceCount,
      });
    }

    function videoPreparingText(event) {
      if (!event) return "";
      if (event.stage === "assets_loading") return t("videoAssetsLoading");
      if (event.stage === "detector_loading") return t("videoDetectorLoading");
      if (event.stage === "metadata_loading") return t("videoMetadataLoading");
      if (event.stage === "fps_sampling") return t("videoFpsSampling");
      if (event.stage === "decode_prepare") return t("videoDecodePreparing");
      if (event.stage === "decode") return t("videoDecodeStarted");
      return "";
    }

    function handleGaitExtractionProgress(group, event, progress) {
      if (!event) return;
      const list = group === "video1" ? state.gait.seq1 : state.gait.seq2;
      if (event.stage === "sequence") {
        renderGaitSequences();
        if (state.apiMode === "auto") list.forEach((seq) => prefetchGaitSequence(seq, list, group));
        return;
      }
      const text = gaitProgressText(event, list.length);
      if (!text) return;
      progress[group] = text;
      state.gait.progress = progress;
      renderGaitProgress(progress);
    }

    function gaitExtractConfig() {
      return {
        defaultJump: state.gaitSettings.frameJump,
        minBoxWidth: state.gaitSettings.minBoxWidth,
        minBoxHeight: state.gaitSettings.minBoxHeight,
        minFrames: state.gaitSettings.minFrames,
        maxFrames: state.gaitSettings.maxFrames,
        requireMoving: !state.gaitSettings.keepStatic,
      };
    }

    function refreshGaitBusy() {
      state.gait.busy = !!(state.gait.busy1 || state.gait.busy2);
      updateActionButtons();
    }

    function pauseGaitExtraction() {
      if (state.gait.abort1) state.gait.abort1.abort();
      if (state.gait.abort2) state.gait.abort2.abort();
      if (state.gait.abortController) state.gait.abortController.abort();
      setStatus(t("gaitStopping", { left: state.gait.seq1.length, right: state.gait.seq2.length }));
    }

    async function extractGaitVideo(group) {
      const isVideo1 = group === "video1";
      const file = isVideo1 ? state.gait.file1 : state.gait.file2;
      if (!file) return;
      const token = gaitFileToken(file);
      if (isVideo1 && state.gait.parsed1Token === token) return;
      if (!isVideo1 && state.gait.parsed2Token === token) return;
      if (isVideo1 && state.gait.abort1) state.gait.abort1.abort();
      if (!isVideo1 && state.gait.abort2) state.gait.abort2.abort();
      const controller = new AbortController();
      if (isVideo1) {
        state.gait.busy1 = true;
        state.gait.abort1 = controller;
        state.gait.selected1 = "";
        state.gait.seq1 = [];
        state.gait.parsed1Token = "";
        if (state.gait.autoCharge && state.gait.autoCharge.video1) state.gait.autoCharge.video1 = { count: 0, amount: 0, trial: false, remaining: NaN };
      } else {
        state.gait.busy2 = true;
        state.gait.abort2 = controller;
        state.gait.selected2 = [];
        state.gait.seq2 = [];
        state.gait.seq2All = [];
        state.gait.parsed2Token = "";
        state.gait.seq2Page = 1;
        if (state.gait.autoCharge && state.gait.autoCharge.video2) state.gait.autoCharge.video2 = { count: 0, amount: 0, trial: false, remaining: NaN };
      }
      state.gait.sortMode = "similarity";
      state.gait.progress[group] = "";
      refreshGaitBusy();
      renderGaitSequences();
      renderGaitProgress(state.gait.progress);
      try {
        const list = isVideo1 ? state.gait.seq1 : state.gait.seq2;
        await extractVideoSequences(file, group, list, (p) => {
          handleGaitExtractionProgress(group, p, state.gait.progress);
        }, gaitExtractConfig(), controller.signal);
        if (isVideo1) {
          state.gait.parsed1Token = token;
        } else {
          state.gait.parsed2Token = token;
          state.gait.seq2All = state.gait.seq2.slice();
          applyGaitTimeRange();
          if (!state.gait.selected2.length) state.gait.selected2 = state.gait.seq2.map((seq) => seq.id);
        }
        state.gait.progress[group] = t("gaitDonePart", { count: list.length });
        renderGaitSequences();
        renderGaitProgress(state.gait.progress);
      } catch (error) {
        if (isAbortError(error)) {
          setStatus(t("gaitStopped", { left: state.gait.seq1.length, right: state.gait.seq2.length }));
        } else {
          state.gait.progress[group] = error.message || t("gaitFailed");
          renderGaitProgress(state.gait.progress);
        }
      } finally {
        if (isVideo1) {
          state.gait.busy1 = false;
          if (state.gait.abort1 === controller) state.gait.abort1 = null;
        } else {
          state.gait.busy2 = false;
          if (state.gait.abort2 === controller) state.gait.abort2 = null;
        }
        refreshGaitBusy();
      }
    }

    async function extractPoseSequences() {
      if (state.pose.busy) {
        return;
      }
      try {
        if (!state.pose.file) throw new Error(t("needVideo"));
        if (poseCurrentVideoParsed()) {
          setPoseParseStatus(t("poseDone", { count: state.pose.sequences.length }), "ok");
          return;
        }
        state.pose.busy = true;
        state.pose.abortController = new AbortController();
        updateActionButtons();
        state.pose.selected = "";
        state.pose.sequences = [];
        state.pose.pendingCalls = 0;
        resetPoseAutoCharge();
        setPoseParseStatus(t("poseParsing"));
        renderPoseSequences();
        const poseExtractConfig = {
          defaultJump: state.poseSettings.frameJump,
          minBoxWidth: state.poseSettings.minBoxWidth,
          minBoxHeight: state.poseSettings.minBoxHeight,
          minFrames: state.poseSettings.minFrames,
          maxFrames: state.poseSettings.maxFrames,
          requireMoving: !state.poseSettings.keepStatic,
        };
        await extractVideoSequences(state.pose.file, "pose", state.pose.sequences, (p) => {
          if (p.stage === "sequence") {
            renderPoseSequences();
            updateActionButtons();
            if (state.apiMode === "auto") {
              state.pose.sequences.forEach((seq) => prefetchPoseSequence(seq));
            }
          } else if (p.stage === "done") {
            setPoseParseStatus(t("poseDone", { count: state.pose.sequences.length }), "ok");
            state.pose.autoExtractDone = true;
            maybeShowPoseAutoChargeSummary();
          } else {
            const preparing = videoPreparingText(p);
            if (preparing) setPoseParseStatus(preparing);
            else if (p.processed) setPoseParseStatus(t("poseProgress", { current: p.current_frame || p.processed, total: p.total || t("unknown"), count: state.pose.sequences.length }));
          }
        }, poseExtractConfig, state.pose.abortController.signal);
        renderPoseSequences();
        setPoseParseStatus(t("poseDone", { count: state.pose.sequences.length }), "ok");
        state.pose.autoExtractDone = true;
        state.pose.parsedToken = gaitFileToken(state.pose.file);
        maybeShowPoseAutoChargeSummary();
      } catch (error) {
        if (isAbortError(error)) {
          setPoseParseStatus(t("poseStopped", { count: state.pose.sequences.length }));
        } else {
          setPoseParseStatus(error.message || t("poseFailed"), "error");
        }
      } finally {
        state.pose.busy = false;
        state.pose.abortController = null;
        updateActionButtons();
      }
    }

    async function extractSelectedPoseSequence() {
      if (state.apiMode !== "manual") return;
      const seq = state.pose.sequences.find((item) => item.id === state.pose.selected);
      if (!seq) return;
      try {
        state.pose.selecting = true;
        updateActionButtons();
        if (!seq.rawResult) {
          if (seq.poseJSONURL) {
            seq.poseStatus = "rendering";
            renderPoseSequences();
            seq.rawResult = await fetchJSONIfAvailable(seq.poseJSONURL);
            if (!seq.rawResult) throw new Error(t("missingPoseResult"));
          } else if (seq.posePromise) {
            seq.rawResult = await seq.posePromise;
          } else {
            seq.poseStatus = "loading";
            renderPoseSequences();
            seq.rawResult = await runSequenceAPI("pose", seq.frames || []);
          }
        }
        seq.poseStatus = "rendering";
        renderPoseSequences();
        await preparePoseArtifacts(seq);
        await showPreparedPoseArtifacts(seq);
        seq.poseStatus = "ready";
        renderPoseSequences();
      } catch (error) {
        if (error.cancelled) return;
        seq.poseStatus = "error";
        const message = error.message || t("poseApiFailed");
        if (error.chargeMessageHTML) setChargeStatusHTML("pose", error.chargeMessageHTML, "error");
        else if (isTrialQuotaMessage(message)) setChargeStatus("pose", message, "error");
        else setPoseAPIStatus(message, "error");
        renderPoseSequences();
      } finally {
        state.pose.selecting = false;
        updateActionButtons();
      }
    }

    async function prefetchPoseSequence(seq) {
      if (!seq || seq.rawResult || seq.poseStatus === "loading" || seq.poseStatus === "error") return;
      try {
        seq.poseStatus = "loading";
        state.pose.pendingCalls += 1;
        renderPoseSequences();
        seq.posePromise = runSequenceAPI("pose", seq.frames || [], { silentCharge: state.apiMode === "auto" });
        seq.rawResult = await seq.posePromise;
        if (state.apiMode === "auto") addPoseAutoCharge(seq.rawResult, (seq.frames || []).length);
        seq.poseStatus = "rendering";
        renderPoseSequences();
        await preparePoseArtifacts(seq);
        seq.poseStatus = "ready";
        renderPoseSequences();
      } catch (error) {
        seq.poseStatus = "error";
        seq.poseError = error.message || t("poseApiFailed");
        renderPoseSequences();
      } finally {
        seq.posePromise = null;
        state.pose.pendingCalls = Math.max(0, state.pose.pendingCalls - 1);
        if (state.pose.pendingCalls > 0) {
        } else {
          maybeShowPoseAutoChargeSummary();
        }
      }
    }

    async function extractGaitSequences() {
      if (state.gait.busy) {
        if (state.gait.abortController) state.gait.abortController.abort();
        setStatus(t("gaitStopping", { left: state.gait.seq1.length, right: state.gait.seq2.length }));
        return;
      }
      try {
        if (!state.gait.file1 || !state.gait.file2) throw new Error(t("needVideo"));
        const runVideo1 = !gaitCurrentVideoParsed("video1");
        const runVideo2 = !gaitCurrentVideoParsed("video2");
        if (!runVideo1 && !runVideo2) {
          state.gait.progress = {
            video1: t("gaitSkippedPart", { count: state.gait.seq1.length }),
            video2: t("gaitSkippedPart", { count: state.gait.seq2All.length || state.gait.seq2.length }),
          };
          renderGaitProgress(state.gait.progress);
          updateActionButtons();
          return;
        }
        state.gait.busy = true;
        state.gait.abortController = new AbortController();
        updateActionButtons();
        if (runVideo1) {
          state.gait.selected1 = "";
          state.gait.seq1 = [];
          state.gait.parsed1Token = "";
        }
        if (runVideo2) {
          state.gait.selected2 = [];
          state.gait.seq2 = [];
          state.gait.seq2All = [];
          state.gait.parsed2Token = "";
          state.gait.seq2Page = 1;
        }
        state.gait.sortMode = "similarity";
        state.gait.pendingCalls = 0;
        state.gait.progress = {
          video1: runVideo1 ? "" : t("gaitSkippedPart", { count: state.gait.seq1.length }),
          video2: runVideo2 ? "" : t("gaitSkippedPart", { count: state.gait.seq2All.length || state.gait.seq2.length }),
        };
        resetGaitAutoCharge();
        renderGaitSequences();
        const progress = { ...state.gait.progress };
        state.gait.progress = progress;
        const gaitExtractConfig = {
          defaultJump: state.gaitSettings.frameJump,
          minBoxWidth: state.gaitSettings.minBoxWidth,
          minBoxHeight: state.gaitSettings.minBoxHeight,
          minFrames: state.gaitSettings.minFrames,
          maxFrames: state.gaitSettings.maxFrames,
          requireMoving: !state.gaitSettings.keepStatic,
        };
        const tasks = [];
        if (runVideo1) {
          tasks.push(extractVideoSequences(state.gait.file1, "video1", state.gait.seq1, (p) => {
            handleGaitExtractionProgress("video1", p, progress);
          }, gaitExtractConfig, state.gait.abortController.signal).then(() => {
            state.gait.parsed1Token = gaitFileToken(state.gait.file1);
          }));
        }
        if (runVideo2) {
          tasks.push(extractVideoSequences(state.gait.file2, "video2", state.gait.seq2, (p) => {
            handleGaitExtractionProgress("video2", p, progress);
          }, gaitExtractConfig, state.gait.abortController.signal).then(() => {
            state.gait.parsed2Token = gaitFileToken(state.gait.file2);
          }));
        }
        renderGaitProgress(progress);
        const results = await Promise.allSettled(tasks);
        const rejected = results.filter((result) => result.status === "rejected").map((result) => result.reason);
        const abortError = rejected.find(isAbortError);
        if (abortError) throw abortError;
        if (rejected.length) throw rejected[0];
        if (runVideo2) {
          state.gait.seq2All = state.gait.seq2.slice();
          applyGaitTimeRange();
          state.gait.selected2 = state.gait.seq2.map((seq) => seq.id);
        }
        renderGaitSequences();
        renderGaitProgress(progress);
      } catch (error) {
        if (isAbortError(error)) {
          setStatus(t("gaitStopped", { left: state.gait.seq1.length, right: state.gait.seq2.length }));
          renderGaitProgress(state.gait.progress || {});
        } else {
          setStatus(error.message || t("gaitFailed"), "error");
        }
      } finally {
        state.gait.busy = false;
        state.gait.abortController = null;
        updateActionButtons();
      }
    }

    function framesForReturnedSequence(sourceSeq, payload) {
      const source = sourceSeq.frames || [];
      const ids = [];
      const pushID = (value) => {
        if (value === undefined || value === null || value === "") return;
        ids.push(String(value));
      };
      (payload.image_ids || payload.imageIds || []).forEach(pushID);
      (payload.frames || []).forEach((frame, index) => pushID(frame.frame_id ?? frame.image_id ?? frame.id ?? index + 1));
      if (!ids.length) return source.slice();
      const wanted = new Set(ids);
      const matched = source.filter((frame, index) => {
        for (const alias of frameAliases(frame, index)) {
          if (wanted.has(alias)) return true;
        }
        return false;
      });
      return matched.length ? matched : source.slice();
    }

    function replaceSequenceWithPayloads(list, sourceSeq, payloads) {
      const index = list.findIndex((item) => item.id === sourceSeq.id);
      if (index < 0) return [];
      if (!payloads.length) {
        removeGaitSequence(list, sourceSeq);
        return [];
      }
      const replacements = payloads.map((payload, offset) => ({
        ...sourceSeq,
        id: String(payload.sequence_id || `${sourceSeq.id}_${offset + 1}`),
        frames: framesForReturnedSequence(sourceSeq, payload),
        feature: payload,
        rawResult: payload,
        status: "ready",
      }));
      list.splice(index, 1, ...replacements);
      const replacementIDs = replacements.map((item) => item.id);
      if (state.gait.selected1 === sourceSeq.id) state.gait.selected1 = replacementIDs[0] || "";
      const selectedIndex = state.gait.selected2.indexOf(sourceSeq.id);
      if (selectedIndex >= 0) {
        state.gait.selected2.splice(selectedIndex, 1, ...replacementIDs);
      }
      return replacements;
    }

    function removeGaitSequence(list, seq) {
      if (!seq) return false;
      const index = list.findIndex((item) => item.id === seq.id);
      if (index < 0) return false;
      list.splice(index, 1);
      if (state.gait.selected1 === seq.id) state.gait.selected1 = "";
      state.gait.selected2 = state.gait.selected2.filter((id) => id !== seq.id);
      return true;
    }

    async function writeGaitFeatureCache(seq) {
      if (!state.cache.ready || !seq || !seq.feature || seq.featureCacheSaved) return;
      try {
        const dir = await cacheSubdir(["gait", sequenceCacheID(seq)]);
        await writeCacheFile(dir, "feature.json", JSON.stringify(seq.feature, null, 2));
        seq.featureCacheSaved = true;
      } catch (error) {
        console.warn("[W-Agent] gait cache write failed:", error);
      }
    }

    async function ensureFeature(seq, list, options = {}) {
      if (seq.feature) return [seq];
      if (seq.featurePromise) return seq.featurePromise;
      seq.status = "loading";
      seq.errorMessage = "";
      renderGaitSequences();
      seq.featurePromise = (async () => {
        if (seq.featureURL) {
          const feature = await fetchJSONIfAvailable(seq.featureURL);
          if (!feature) throw new Error(t("apiFailed"));
          seq.feature = feature;
          seq.rawResult = feature;
          seq.status = "ready";
          renderGaitSequences();
          return [seq];
        }
        if (isDemoGaitSequence(seq)) {
          throw new Error(t("missingDemoFeature"));
        }
        const result = await runSequenceAPI("sequence", seq.frames || [], options);
        if (options.autoChargeGroup && state.apiMode === "auto") addGaitAutoCharge(options.autoChargeGroup, result, (seq.frames || []).length);
        const payloads = sequencePayloads(result);
        if (!payloads.length) {
          replaceSequenceWithPayloads(list, seq, []);
          renderGaitSequences();
          return null;
        }
        const replacements = replaceSequenceWithPayloads(list, seq, payloads);
        await Promise.all(replacements.map(writeGaitFeatureCache));
        renderGaitSequences();
        return replacements.filter((item) => item && item.feature);
      })();
      try {
        return await seq.featurePromise;
      } catch (error) {
        seq.status = "error";
        seq.errorMessage = error.message || t("apiFailedStatus");
        renderGaitSequences();
        throw error;
      } finally {
        seq.featurePromise = null;
      }
    }

    function prefetchGaitSequence(seq, list, group = "") {
      if (!seq || seq.feature || seq.featurePromise || seq.prefetchQueued || seq.status === "invalid" || seq.status === "error") return;
      seq.prefetchQueued = true;
      state.gait.prefetchQueue.push({ seq, list, group });
      processGaitPrefetchQueue();
    }

    async function processGaitPrefetchQueue() {
      if (state.gait.prefetchActive) return;
      state.gait.prefetchActive = true;
      try {
        while (state.gait.prefetchQueue.length) {
          const item = state.gait.prefetchQueue.shift();
          const seq = item && item.seq;
          if (!seq) continue;
          seq.prefetchQueued = false;
          if (state.apiMode !== "auto") continue;
          if (seq.feature || seq.featurePromise || seq.status === "invalid" || seq.status === "error") continue;
          try {
            state.gait.pendingCalls += 1;
            await ensureFeature(seq, item.list, { silentCharge: true, autoChargeGroup: item.group });
          } catch (error) {
            removeGaitSequence(item.list, seq);
            renderGaitSequences();
          } finally {
            state.gait.pendingCalls = Math.max(0, state.gait.pendingCalls - 1);
            renderGaitProgress(state.gait.progress || {});
          }
        }
      } finally {
        state.gait.prefetchActive = false;
        if (state.gait.prefetchQueue.length) processGaitPrefetchQueue();
      }
    }

    async function selectPoseSequence(id) {
      const seq = state.pose.sequences.find((item) => item.id === id);
      const hasPreparedArtifacts = Boolean(seq && seq.rawResult && seq.pose2DURL && seq.pose3DFrames);
      if (!seq || (state.pose.selecting && !hasPreparedArtifacts)) return;
      const previousSelected = state.pose.selected;
      try {
        state.pose.selecting = !hasPreparedArtifacts;
        state.pose.selected = id;
        renderPoseSequences();
        updateActionButtons();
        if (!seq.rawResult) {
          if (seq.poseJSONURL) {
            seq.poseStatus = "rendering";
            renderPoseSequences();
            seq.rawResult = await fetchJSONIfAvailable(seq.poseJSONURL);
            if (!seq.rawResult) throw new Error(t("missingPoseResult"));
          } else if (seq.posePromise) {
            seq.rawResult = await seq.posePromise;
          } else {
            seq.poseStatus = "loading";
            renderPoseSequences();
            seq.rawResult = await runSequenceAPI("pose", seq.frames || []);
          }
          seq.poseStatus = "rendering";
          renderPoseSequences();
          await preparePoseArtifacts(seq);
          seq.poseStatus = "ready";
        }
        if (!seq.pose2DURL || !seq.pose3DFrames) {
          await preparePoseArtifacts(seq);
          seq.poseStatus = "ready";
          renderPoseSequences();
        }
        await showPreparedPoseArtifacts(seq);
        seq.poseStatus = "ready";
        renderPoseSequences();
      } catch (error) {
        if (error.cancelled) {
          state.pose.selected = previousSelected || "";
          renderPoseSequences();
          const previousSeq = state.pose.sequences.find((item) => item.id === state.pose.selected);
          if (previousSeq && previousSeq.pose2DURL && previousSeq.pose3DFrames) {
            await showPreparedPoseArtifacts(previousSeq);
          }
          return;
        }
        seq.poseStatus = "error";
        state.pose.selected = previousSelected && previousSelected !== id ? previousSelected : "";
        const message = error.message || t("poseApiFailed");
        if (error.chargeMessageHTML) setChargeStatusHTML("pose", error.chargeMessageHTML, "error");
        else if (isTrialQuotaMessage(message)) setChargeStatus("pose", message, "error");
        else setPoseAPIStatus(message, "error");
        renderPoseSequences();
        const previousSeq = state.pose.sequences.find((item) => item.id === state.pose.selected);
        if (previousSeq && previousSeq.pose2DURL && previousSeq.pose3DFrames) {
          await showPreparedPoseArtifacts(previousSeq);
        } else {
          clearPoseResultDisplay();
        }
      } finally {
        state.pose.selecting = false;
        updateActionButtons();
      }
    }

    function poseArray(result, key) {
      const pascalKey = key.replace(/(?:^|_)([a-z])/g, (_, chr) => chr.toUpperCase());
      const sdkKey = key === "pose_2ds" ? "Pose2Ds" : (key === "pose_3ds" ? "Pose3Ds" : pascalKey);
      return result?.result?.[key] || result?.[key] || result?.sequence?.[key] ||
        result?.result?.[sdkKey] || result?.[sdkKey] || result?.sequence?.[sdkKey] ||
        result?.result?.[pascalKey] || result?.[pascalKey] || result?.sequence?.[pascalKey] || [];
    }

    function posePoints(frame, stride) {
      const out = [];
      for (let i = 0; i + stride - 1 < (frame || []).length; i += stride) {
        out.push({ x: Number(frame[i]), y: Number(frame[i + 1]), z: Number(frame[i + 2] || 0), score: Number(frame[i + 2] || 0) });
      }
      return out;
    }

    async function imageFromFrame(frame) {
      const b64 = await frameBase64(frame);
      if (!b64) return null;
      return loadImage("data:image/jpeg;base64," + b64);
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error(t("fileReadFailed")));
        reader.readAsDataURL(blob);
      });
    }

    async function renderCanvasVideo(drawFrame, frameCount, width, height, fps = 25) {
      if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        throw new Error(t("browserVideoUnsupported"));
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      const chunks = [];
      const stream = canvas.captureStream(0);
      const videoTrack = stream.getVideoTracks && stream.getVideoTracks()[0];
      const manualFrameCapture = Boolean(videoTrack && typeof videoTrack.requestFrame === "function");
      if (!manualFrameCapture) {
        stream.getTracks().forEach((track) => track.stop());
      }
      const captureStream = manualFrameCapture ? stream : canvas.captureStream(fps);
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
      const recorder = new MediaRecorder(captureStream, { mimeType });
      recorder.ondataavailable = (event) => { if (event.data && event.data.size) chunks.push(event.data); };
      const stopped = new Promise((resolve) => { recorder.onstop = resolve; });
      recorder.start();
      for (let i = 0; i < frameCount; i += 1) {
        await drawFrame(ctx, i, width, height);
        if (manualFrameCapture) videoTrack.requestFrame();
        await new Promise((resolve) => setTimeout(resolve, 1000 / fps));
      }
      recorder.stop();
      await stopped;
      captureStream.getTracks().forEach((track) => track.stop());
      const blob = new Blob(chunks, { type: "video/webm" });
      if (window.location.protocol === "file:") {
        return blobToDataURL(blob);
      }
      return URL.createObjectURL(blob);
    }

    function medianPositive(values) {
      const nums = (values || []).filter((value) => Number.isFinite(value) && value > 0).sort((a, b) => a - b);
      if (!nums.length) return NaN;
      const mid = Math.floor(nums.length / 2);
      return nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
    }

    function poseSequenceFPS(seq) {
      const frames = Array.isArray(seq?.frames) ? seq.frames : [];
      const frameSteps = [];
      const timeSteps = [];
      for (let index = 1; index < frames.length; index += 1) {
        const prev = frames[index - 1] || {};
        const current = frames[index] || {};
        const prevFrameID = Number(prev.frame_id ?? prev.frameId ?? NaN);
        const currentFrameID = Number(current.frame_id ?? current.frameId ?? NaN);
        const prevTime = Number(prev.time ?? NaN);
        const currentTime = Number(current.time ?? NaN);
        if (Number.isFinite(prevFrameID) && Number.isFinite(currentFrameID)) {
          frameSteps.push(currentFrameID - prevFrameID);
        }
        if (Number.isFinite(prevTime) && Number.isFinite(currentTime)) {
          timeSteps.push(currentTime - prevTime);
        }
      }
      const timeStep = medianPositive(timeSteps);
      if (Number.isFinite(timeStep)) return Math.max(1, Math.min(60, 1 / timeStep));
      const frameStep = medianPositive(frameSteps);
      const sourceFPS = 30;
      const configuredJump = Math.max(1, Number(state.poseSettings.frameJump || 1));
      const effectiveJump = Number.isFinite(frameStep) ? Math.max(1, frameStep) : configuredJump;
      return Math.max(1, Math.min(60, sourceFPS / effectiveJump));
    }

    async function renderPose2DVideo(seq, result) {
      const pose = poseArray(result, "pose_2ds");
      const count = Math.min((seq.frames || []).length, pose.length);
      if (!count) throw new Error(t("noPose2D"));
      const images = [];
      for (let index = 0; index < count; index += 1) {
        images.push(await imageFromFrame(seq.frames[index]));
      }
      const firstImage = images.find(Boolean);
      const width = firstImage ? firstImage.naturalWidth : 640;
      const height = firstImage ? firstImage.naturalHeight : 960;
      const fps = poseSequenceFPS(seq);
      return renderCanvasVideo((ctx, index, w, h) => {
        const image = images[index];
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        if (image) ctx.drawImage(image, 0, 0, w, h);
      }, count, width, height, fps);
    }

    function pose3DBounds(frames) {
      const bounds = { minX: Infinity, minY: Infinity, minZ: Infinity, maxX: -Infinity, maxY: -Infinity, maxZ: -Infinity };
      frames.forEach((frame) => frame.forEach((p) => {
        if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z)) return;
        bounds.minX = Math.min(bounds.minX, p.x);
        bounds.minY = Math.min(bounds.minY, p.y);
        bounds.minZ = Math.min(bounds.minZ, p.z);
        bounds.maxX = Math.max(bounds.maxX, p.x);
        bounds.maxY = Math.max(bounds.maxY, p.y);
        bounds.maxZ = Math.max(bounds.maxZ, p.z);
      }));
      return Number.isFinite(bounds.minX) ? bounds : null;
    }

    function pose3DFrameScale(frame) {
      const bounds = pose3DBounds([frame]);
      if (!bounds) return 0;
      return Math.max(bounds.maxY - bounds.minY, bounds.maxX - bounds.minX, bounds.maxZ - bounds.minZ, 0);
    }

    function medianNumber(values) {
      const sorted = values.filter((value) => Number.isFinite(value) && value > 0).sort((a, b) => a - b);
      if (!sorted.length) return 1;
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function normalizePose3DFramesForDisplay(frames) {
      const validFrames = (frames || []).filter((frame) => Array.isArray(frame) && frame.length);
      if (!validFrames.length) return [];
      const globalBounds = pose3DBounds(validFrames);
      if (!globalBounds) return validFrames;
      const targetScale = medianNumber(validFrames.map((frame) => pose3DFrameScale(frame)));
      const targetCenter = {
        x: (globalBounds.minX + globalBounds.maxX) / 2,
        y: (globalBounds.minY + globalBounds.maxY) / 2,
        z: (globalBounds.minZ + globalBounds.maxZ) / 2,
      };
      return validFrames.map((frame) => {
        const bounds = pose3DBounds([frame]);
        const frameScale = pose3DFrameScale(frame);
        if (!bounds || !frameScale) return frame;
        const scale = Math.max(0.25, Math.min(4, targetScale / frameScale));
        const center = {
          x: (bounds.minX + bounds.maxX) / 2,
          y: (bounds.minY + bounds.maxY) / 2,
          z: (bounds.minZ + bounds.maxZ) / 2,
        };
        return frame.map((point) => ({
          x: targetCenter.x + (point.x - center.x) * scale,
          y: targetCenter.y + (point.y - center.y) * scale,
          z: targetCenter.z + (point.z - center.z) * scale,
          score: point.score,
        }));
      });
    }

    function projectPose3D(point, view, width, height) {
      const x = point.x - view.cx;
      const y = point.y - view.cy;
      const z = point.z - view.cz;
      const cosy = Math.cos(view.yaw);
      const siny = Math.sin(view.yaw);
      const cosp = Math.cos(view.pitch);
      const sinp = Math.sin(view.pitch);
      const rx = x * cosy - z * siny;
      const rz = x * siny + z * cosy;
      const ry = y * cosp - rz * sinp;
      const rz2 = y * sinp + rz * cosp;
      const depth = Math.max(0.2, view.distance + rz2);
      const perspective = view.distance / depth;
      const scaleX = Number.isFinite(view.scaleX) ? view.scaleX : view.scale;
      const scaleY = Number.isFinite(view.scaleY) ? view.scaleY : view.scale;
      return {
        x: width / 2 + (view.offsetX || 0) + rx * scaleX * perspective,
        y: height / 2 + (view.offsetY || 0) + ry * scaleY * perspective,
      };
    }

    function pose3DProjectedBounds(frames, view, width, height) {
      const bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      frames.forEach((frame) => frame.forEach((point) => {
        const projected = projectPose3D(point, view, width, height);
        if (!Number.isFinite(projected.x) || !Number.isFinite(projected.y)) return;
        bounds.minX = Math.min(bounds.minX, projected.x);
        bounds.minY = Math.min(bounds.minY, projected.y);
        bounds.maxX = Math.max(bounds.maxX, projected.x);
        bounds.maxY = Math.max(bounds.maxY, projected.y);
      }));
      return Number.isFinite(bounds.minX) ? bounds : null;
    }

    function pose3DViewForFrame(frame, width, height, yaw = pose3DState.yaw, pitch = pose3DState.pitch, zoom = pose3DState.zoom) {
      const frames = pose3DState.frames && pose3DState.frames.length ? pose3DState.frames : [frame];
      const bounds = pose3DBounds(frames);
      if (!bounds) return null;
      const maxAbs = Math.max(
        Math.abs(bounds.minX), Math.abs(bounds.maxX),
        Math.abs(bounds.minY), Math.abs(bounds.maxY),
        Math.abs(bounds.minZ), Math.abs(bounds.maxZ),
      );
      const normalizedRange = maxAbs <= 1.5;
      const span = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY, bounds.maxZ - bounds.minZ, 1);
      const view = {
        cx: (bounds.minX + bounds.maxX) / 2,
        cy: (bounds.minY + bounds.maxY) / 2,
        cz: (bounds.minZ + bounds.maxZ) / 2,
        scale: 1,
        scaleX: 1,
        scaleY: 1,
        offsetX: 0,
        offsetY: 0,
        distance: normalizedRange ? 3.2 : Math.max(span * 2.5, 2),
        yaw,
        pitch,
      };
      const projectedAtUnitScale = pose3DProjectedBounds(frames, view, width, height);
      if (projectedAtUnitScale) {
        const spanW = Math.max(1, projectedAtUnitScale.maxX - projectedAtUnitScale.minX);
        const spanH = Math.max(1, projectedAtUnitScale.maxY - projectedAtUnitScale.minY);
        const marginX = width * 0.12;
        const marginY = height * 0.12;
        view.scaleX = ((width - marginX * 2) / spanW) * zoom;
        view.scaleY = ((height - marginY * 2) / spanH) * zoom;
        view.scale = Math.min(view.scaleX, view.scaleY);
        const projected = pose3DProjectedBounds(frames, view, width, height);
        if (projected) {
          view.offsetX = width / 2 - (projected.minX + projected.maxX) / 2;
          view.offsetY = height / 2 - (projected.minY + projected.maxY) / 2;
        }
      } else {
        view.scale = Math.min(width, height) * (normalizedRange ? 0.82 : 0.55) * zoom / span;
      }
      return view;
    }

    function resizePose3DCanvas() {
      const canvas = $("pose3DCanvas");
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      return { canvas, width, height, ratio };
    }

    function drawPose3DAxis(ctx, origin, end, color, label, ratio) {
      if (!origin || !end) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = Math.max(2, 3 * ratio);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
      const angle = Math.atan2(end.y - origin.y, end.x - origin.x);
      const head = 10 * ratio;
      ctx.beginPath();
      ctx.moveTo(end.x, end.y);
      ctx.lineTo(end.x - Math.cos(angle - Math.PI / 6) * head, end.y - Math.sin(angle - Math.PI / 6) * head);
      ctx.lineTo(end.x - Math.cos(angle + Math.PI / 6) * head, end.y - Math.sin(angle + Math.PI / 6) * head);
      ctx.closePath();
      ctx.fill();
      ctx.font = `${Math.max(12, Math.round(14 * ratio))}px sans-serif`;
      ctx.fillText(label, end.x + 6 * ratio, end.y - 6 * ratio);
      ctx.restore();
    }

    function drawPose3DGridLine(ctx, a, b, view, width, height) {
      const p1 = projectPose3D(a, view, width, height);
      const p2 = projectPose3D(b, view, width, height);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    function drawPose3DMoCapBackground(ctx, width, height, ratio) {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#071019");
      gradient.addColorStop(0.62, "#0b1521");
      gradient.addColorStop(1, "#10141d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      const vignette = ctx.createRadialGradient(width * 0.48, height * 0.42, Math.min(width, height) * 0.12, width * 0.48, height * 0.42, Math.max(width, height) * 0.72);
      vignette.addColorStop(0, "rgba(255,255,255,0.04)");
      vignette.addColorStop(1, "rgba(0,0,0,0.38)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.strokeStyle = "rgba(116, 170, 220, 0.08)";
      ctx.lineWidth = Math.max(1, ratio);
      const step = Math.max(24 * ratio, Math.min(width, height) / 14);
      for (let x = 0; x <= width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPose3DGridBox(ctx, view, width, height, ratio) {
      const bounds = pose3DBounds(pose3DState.frames || []);
      if (!bounds) return;
      const spanX = Math.max(bounds.maxX - bounds.minX, 1);
      const spanY = Math.max(bounds.maxY - bounds.minY, 1);
      const spanZ = Math.max(bounds.maxZ - bounds.minZ, 1);
      const padX = spanX * 0.28;
      const padY = spanY * 0.16;
      const padZ = spanZ * 0.34;
      const box = {
        minX: bounds.minX - padX,
        maxX: bounds.maxX + padX,
        minY: bounds.minY - padY,
        maxY: bounds.maxY + padY,
        minZ: bounds.minZ - padZ,
        maxZ: bounds.maxZ + padZ,
      };
      const steps = 5;
      ctx.save();
      ctx.strokeStyle = "rgba(91, 141, 189, 0.34)";
      ctx.lineWidth = Math.max(1, ratio);
      ctx.lineCap = "butt";
      ctx.globalAlpha = 1;
      for (let i = 0; i <= steps; i++) {
        const tx = i / steps;
        const x = box.minX + (box.maxX - box.minX) * tx;
        const y = box.minY + (box.maxY - box.minY) * tx;
        const z = box.minZ + (box.maxZ - box.minZ) * tx;
        drawPose3DGridLine(ctx, { x, y: box.maxY, z: box.minZ }, { x, y: box.maxY, z: box.maxZ }, view, width, height);
        drawPose3DGridLine(ctx, { x: box.minX, y: box.maxY, z }, { x: box.maxX, y: box.maxY, z }, view, width, height);
        drawPose3DGridLine(ctx, { x, y: box.minY, z: box.maxZ }, { x, y: box.maxY, z: box.maxZ }, view, width, height);
        drawPose3DGridLine(ctx, { x: box.minX, y, z: box.maxZ }, { x: box.maxX, y, z: box.maxZ }, view, width, height);
        drawPose3DGridLine(ctx, { x: box.maxX, y: box.minY, z }, { x: box.maxX, y: box.maxY, z }, view, width, height);
        drawPose3DGridLine(ctx, { x: box.maxX, y, z: box.minZ }, { x: box.maxX, y, z: box.maxZ }, view, width, height);
      }
      ctx.strokeStyle = "rgba(168, 212, 255, 0.58)";
      ctx.lineWidth = Math.max(1.2, 1.8 * ratio);
      drawPose3DGridLine(ctx, { x: box.minX, y: box.maxY, z: box.minZ }, { x: box.maxX, y: box.maxY, z: box.minZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.minX, y: box.maxY, z: box.minZ }, { x: box.minX, y: box.maxY, z: box.maxZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.minX, y: box.maxY, z: box.minZ }, { x: box.minX, y: box.minY, z: box.minZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.maxX, y: box.maxY, z: box.minZ }, { x: box.maxX, y: box.maxY, z: box.maxZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.minX, y: box.maxY, z: box.maxZ }, { x: box.maxX, y: box.maxY, z: box.maxZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.minX, y: box.minY, z: box.maxZ }, { x: box.maxX, y: box.minY, z: box.maxZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.maxX, y: box.minY, z: box.minZ }, { x: box.maxX, y: box.minY, z: box.maxZ }, view, width, height);
      drawPose3DGridLine(ctx, { x: box.maxX, y: box.maxY, z: box.maxZ }, { x: box.maxX, y: box.minY, z: box.maxZ }, view, width, height);
      ctx.restore();
    }

    function pose3DAxisEndpoint(origin, axis, view, length) {
      const cosy = Math.cos(view.yaw);
      const siny = Math.sin(view.yaw);
      const cosp = Math.cos(view.pitch);
      const sinp = Math.sin(view.pitch);
      const rx = axis.x * cosy - axis.z * siny;
      const rz = axis.x * siny + axis.z * cosy;
      const ry = axis.y * cosp - rz * sinp;
      return {
        x: origin.x - rx * length,
        y: origin.y - ry * length,
      };
    }

    function drawPose3DAxes(ctx, view, width, height, ratio) {
      const margin = 28 * ratio;
      const origin = { x: width - margin, y: margin };
      const length = Math.max(70 * ratio, Math.min(width, height) * 0.18);
      ctx.save();
      ctx.fillStyle = "rgba(5, 12, 20, 0.68)";
      ctx.strokeStyle = "rgba(147, 197, 253, 0.22)";
      ctx.lineWidth = Math.max(1, ratio);
      ctx.beginPath();
      ctx.roundRect(width - 128 * ratio, 12 * ratio, 116 * ratio, 116 * ratio, 10 * ratio);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      drawPose3DAxis(ctx, origin, pose3DAxisEndpoint(origin, { x: 1, y: 0, z: 0 }, view, length), "#ff5b5b", "X", ratio);
      drawPose3DAxis(ctx, origin, pose3DAxisEndpoint(origin, { x: 0, y: -1, z: 0 }, view, length), "#48d17a", "Y", ratio);
      drawPose3DAxis(ctx, origin, pose3DAxisEndpoint(origin, { x: 0, y: 0, z: 1 }, view, length), "#58a6ff", "Z", ratio);
    }

    function drawPose3DBone(ctx, p1, p2, ratio) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const length = Math.hypot(dx, dy);
      if (!Number.isFinite(length) || length < 0.5) return;
      const nx = -dy / length;
      const ny = dx / length;
      const widthScale = Math.max(0.45, Math.min(1, length / (42 * ratio)));
      const baseWidth = Math.max(1.6, 3.6 * ratio * widthScale);
      const tipWidth = Math.max(0.4, 0.75 * ratio * widthScale);
      ctx.save();
      ctx.lineJoin = "round";
      ctx.fillStyle = "rgba(43, 122, 145, 0.82)";
      ctx.beginPath();
      ctx.moveTo(p1.x + nx * baseWidth, p1.y + ny * baseWidth);
      ctx.lineTo(p2.x + nx * tipWidth, p2.y + ny * tipWidth);
      ctx.lineTo(p2.x - nx * tipWidth, p2.y - ny * tipWidth);
      ctx.lineTo(p1.x - nx * baseWidth, p1.y - ny * baseWidth);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawPose3DHud(ctx, frameIndex, total, ratio) {
      ctx.save();
      ctx.fillStyle = "rgba(5, 12, 20, 0.64)";
      ctx.strokeStyle = "rgba(147, 197, 253, 0.22)";
      ctx.lineWidth = Math.max(1, ratio);
      ctx.beginPath();
      ctx.roundRect(14 * ratio, 14 * ratio, 174 * ratio, 48 * ratio, 10 * ratio);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(226, 244, 255, 0.96)";
      ctx.font = `${Math.max(12, Math.round(13 * ratio))}px sans-serif`;
      ctx.fillText("3D MoCap Viewer", 26 * ratio, 34 * ratio);
      ctx.fillStyle = "rgba(147, 197, 253, 0.9)";
      ctx.font = `${Math.max(11, Math.round(12 * ratio))}px sans-serif`;
      ctx.fillText(`Frame ${frameIndex + 1} / ${Math.max(1, total)}`, 26 * ratio, 52 * ratio);
      ctx.restore();
    }

    function drawPose3DCanvas(frameIndex = pose3DState.frameIndex) {
      const { canvas, width, height, ratio } = resizePose3DCanvas();
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, width, height);
      drawPose3DMoCapBackground(ctx, width, height, ratio);
      const frame = pose3DState.frames[frameIndex];
      if (!frame) return;
      const view = pose3DViewForFrame(frame, width, height);
      if (!view) return;
      drawPose3DGridBox(ctx, view, width, height, ratio);
      drawPose3DAxes(ctx, view, width, height, ratio);
      const points = frame.map((point) => projectPose3D(point, view, width, height));
      const visible = pose3DState.visibleFrames[frameIndex] || [];
      pose3DPairs.forEach(([a, b]) => {
        if (!visible[a] || !visible[b]) return;
        const p1 = points[a];
        const p2 = points[b];
        if (!p1 || !p2) return;
        drawPose3DBone(ctx, p1, p2, ratio);
      });
      drawPose3DHud(ctx, frameIndex, pose3DState.frames.length, ratio);
    }

    function pose3DFrameIndexFromVideo() {
      const video = $("pose2DVideo");
      const total = pose3DState.frames.length;
      if (!total) return 0;
      const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : total / 25;
      return Math.max(0, Math.min(total - 1, Math.floor((video.currentTime / duration) * total)));
    }

    function syncPose3DTo2DVideo() {
      pose3DState.raf = 0;
      pose3DState.frameIndex = pose3DFrameIndexFromVideo();
      drawPose3DCanvas(pose3DState.frameIndex);
      if (!$("pose2DVideo").paused && pose3DState.frames.length) pose3DState.raf = requestAnimationFrame(syncPose3DTo2DVideo);
    }

    function preparePose3DCanvas(result) {
      const pose3DData = pose3DFramesWithVisibility(result);
      pose3DState.rawFrames = pose3DData.frames;
      pose3DState.visibleFrames = pose3DData.visibleFrames;
      pose3DState.frames = normalizePose3DFramesForDisplay(pose3DState.rawFrames);
      pose3DState.frameIndex = 0;
      pose3DState.yaw = -30 * Math.PI / 180;
      pose3DState.pitch = 15 * Math.PI / 180;
      pose3DState.zoom = 1;
      if (!pose3DState.frames.length) throw new Error(t("noPose3D"));
      drawPose3DCanvas(0);
    }

    async function preparePoseArtifacts(seq) {
      if (!seq || !seq.rawResult) throw new Error(t("missingPoseResult"));
      if (!seq.pose2DURL) seq.pose2DURL = await renderPose2DVideo(seq, seq.rawResult);
      if (!seq.pose3DFrames) {
        const pose3DData = pose3DFramesWithVisibility(seq.rawResult);
        seq.pose3DFrames = pose3DData.frames;
        seq.pose3DVisibleFrames = pose3DData.visibleFrames;
        if (!seq.pose3DFrames.length) throw new Error(t("noPose3D"));
      }
      if (!seq.pose3DVisibleFrames) {
        seq.pose3DVisibleFrames = pose3DFramesWithVisibility(seq.rawResult).visibleFrames;
      }
      await writePoseCache(seq);
    }

    async function writePoseCache(seq) {
      if (!state.cache.ready || seq.poseCacheSaved) return;
      try {
        const dir = await cacheSubdir(["pose", sequenceCacheID(seq)]);
        await writeCacheFile(dir, "pose-result.json", JSON.stringify(seq.rawResult, null, 2));
        await writeCacheFile(dir, "pose-3d.json", JSON.stringify(seq.pose3DFrames || [], null, 2));
        if (seq.pose2DURL) {
          const blob = await fetch(seq.pose2DURL).then((resp) => resp.blob());
          await writeCacheFile(dir, "pose-2d.webm", blob);
        }
        seq.poseCacheSaved = true;
      } catch (error) {
        console.warn("[W-Agent] pose cache write failed:", error);
      }
    }

    function waitForVideoReady(video) {
      if (video.readyState >= 2) return Promise.resolve();
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (error) => {
          if (done) return;
          done = true;
          video.removeEventListener("loadedmetadata", finish);
          video.removeEventListener("canplay", finish);
          video.removeEventListener("error", fail);
          if (error instanceof Error) reject(error);
          else resolve();
        };
        const fail = () => {
          const error = video.error ? new Error(video.error.message || "video_load_failed") : new Error("video_load_failed");
          finish(error);
        };
        video.addEventListener("loadedmetadata", finish, { once: true });
        video.addEventListener("canplay", finish, { once: true });
        video.addEventListener("error", fail, { once: true });
        setTimeout(finish, 800);
      });
    }

    async function restartPose2DVideo(video, src) {
      const sameSource = video.src === src;
      video.pause();
      if (!sameSource) video.src = src;
      video.load();
      await waitForVideoReady(video);
      try {
        video.currentTime = 0;
      } catch (_) {}
      await video.play();
    }

    async function showPreparedPoseArtifacts(seq) {
      if (!seq || !seq.pose2DURL || !seq.pose3DFrames) return;
      const video2D = $("pose2DVideo");
      video2D.poster = WHITE_POSTER;
      pose3DState.rawFrames = seq.pose3DFrames;
      pose3DState.visibleFrames = seq.pose3DVisibleFrames || pose3DFramesWithVisibility(seq.rawResult).visibleFrames;
      pose3DState.frames = normalizePose3DFramesForDisplay(seq.pose3DFrames);
      pose3DState.frameIndex = 0;
      pose3DState.yaw = -30 * Math.PI / 180;
      pose3DState.pitch = 15 * Math.PI / 180;
      pose3DState.zoom = 1;
      drawPose3DCanvas(0);
      try {
        await restartPose2DVideo(video2D, seq.pose2DURL);
        syncPose3DTo2DVideo();
      } catch (error) {
        if (seq.rawResult) {
          seq.pose2DURL = await renderPose2DVideo(seq, seq.rawResult);
          await restartPose2DVideo(video2D, seq.pose2DURL);
          syncPose3DTo2DVideo();
        } else {
          drawPose3DCanvas(0);
        }
      }
    }

    function clearPoseResultDisplay() {
      const video2D = $("pose2DVideo");
      if (video2D) {
        video2D.pause();
        video2D.removeAttribute("src");
        video2D.removeAttribute("poster");
        video2D.load();
      }
      pose3DState.rawFrames = [];
      pose3DState.visibleFrames = [];
      pose3DState.frames = [];
      pose3DState.frameIndex = 0;
      drawPose3DCanvas(0);
    }

    async function renderPoseVideos(seq, result) {
      seq.rawResult = result;
      await preparePoseArtifacts(seq);
      await showPreparedPoseArtifacts(seq);
    }

    function syncPoseVideos() {
      const left = $("pose2DVideo");
      ["play", "timeupdate", "seeking", "loadedmetadata", "pause"].forEach((eventName) => {
        left.addEventListener(eventName, () => {
          if (pose3DState.raf) cancelAnimationFrame(pose3DState.raf);
          syncPose3DTo2DVideo();
        });
      });
    }

    function bindPose3DCanvasControls() {
      const canvas = $("pose3DCanvas");
      canvas.addEventListener("pointerdown", (event) => {
        pose3DState.dragging = true;
        pose3DState.lastX = event.clientX;
        pose3DState.lastY = event.clientY;
        canvas.classList.add("dragging");
        canvas.setPointerCapture?.(event.pointerId);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!pose3DState.dragging) return;
        const dx = event.clientX - pose3DState.lastX;
        const dy = event.clientY - pose3DState.lastY;
        pose3DState.lastX = event.clientX;
        pose3DState.lastY = event.clientY;
        pose3DState.yaw += dx * 0.01;
        pose3DState.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pose3DState.pitch + dy * 0.01));
        drawPose3DCanvas();
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => {
        canvas.addEventListener(eventName, (event) => {
          pose3DState.dragging = false;
          canvas.classList.remove("dragging");
          canvas.releasePointerCapture?.(event.pointerId);
        });
      });
      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        pose3DState.zoom = Math.max(0.5, Math.min(2.5, pose3DState.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
        drawPose3DCanvas();
      }, { passive: false });
      canvas.addEventListener("dblclick", () => {
        pose3DState.yaw = -30 * Math.PI / 180;
        pose3DState.pitch = 15 * Math.PI / 180;
        pose3DState.zoom = 1;
        drawPose3DCanvas();
      });
      window.addEventListener("resize", () => drawPose3DCanvas());
    }

    function selectGaitSequence(group, id) {
      if (group === "gait1") {
        state.gait.selected1 = state.gait.selected1 === id ? "" : id;
      } else {
        const index = state.gait.selected2.indexOf(id);
        if (index >= 0) state.gait.selected2.splice(index, 1);
        else state.gait.selected2.push(id);
      }
      renderGaitSequences();
    }

    function toggleGaitSelectAll() {
      if (!state.gait.seq2.length) return;
      if (state.gait.selected2.length === state.gait.seq2.length) {
        state.gait.selected2 = [];
      } else {
        state.gait.selected2 = state.gait.seq2.map((seq) => seq.id);
      }
      renderGaitSequences();
    }

    function toggleGaitSort() {
      state.gait.sortMode = state.gait.sortMode === "similarity" ? "default" : "similarity";
      state.gait.seq2Page = 1;
      renderGaitSequences();
    }

    function changeGaitSeq2Page(delta) {
      const pageInfo = gaitSeq2PageInfo(state.gait.seq2.length);
      state.gait.seq2Page = Math.max(1, Math.min(pageInfo.page + delta, pageInfo.totalPages));
      renderGaitSequences();
    }

    async function showSequenceFrames(seq, title) {
      if (!seq || !Array.isArray(seq.frames) || !seq.frames.length) return;
      $("sequenceFramesTitle").textContent = title || t("sequenceImages");
      sequenceFrameViewer.frames = [];
      sequenceFrameViewer.index = 0;
      $("sequenceFrameStage").innerHTML = `<div class="empty">${escapeHTML(t("loadingSequenceImages"))}</div>`;
      updateSequenceFrameViewer();
      $("sequenceFramesModal").classList.remove("hidden");
      const frames = [];
      for (let index = 0; index < seq.frames.length; index += 1) {
        const frame = seq.frames[index];
        let content = framePreviewBase64(frame);
        if (!content && frame?.cacheHandle) {
          try {
            content = await readFileHandleAsBase64(frame.cacheHandle);
          } catch (error) {
            content = "";
          }
        }
        if (!content) {
          try {
            content = await frameBase64(frame);
          } catch (error) {
            content = "";
          }
        }
        if (!content) continue;
        frames.push({ index, content });
      }
      sequenceFrameViewer.frames = frames;
      sequenceFrameViewer.index = 0;
      updateSequenceFrameViewer();
    }

    function updateSequenceFrameViewer() {
      const total = sequenceFrameViewer.frames.length;
      const current = total ? Math.max(0, Math.min(sequenceFrameViewer.index, total - 1)) : 0;
      sequenceFrameViewer.index = current;
      $("sequenceFrameCounter").textContent = total ? t("frameCounter", { frame: sequenceFrameViewer.frames[current].index + 1, current: current + 1, total }) : "0 / 0";
      $("sequenceFramePrev").disabled = !total || current <= 0;
      $("sequenceFrameNext").disabled = !total || current >= total - 1;
      if (!total) {
        $("sequenceFrameStage").innerHTML = `<div class="empty">${escapeHTML(t("noSequenceImages"))}</div>`;
        return;
      }
      const frame = sequenceFrameViewer.frames[current];
      $("sequenceFrameStage").innerHTML = `<img src="data:image/jpeg;base64,${frame.content}" alt="frame ${frame.index + 1}">`;
    }

    function stepSequenceFrame(delta) {
      if (!sequenceFrameViewer.frames.length) return;
      sequenceFrameViewer.index += delta;
      updateSequenceFrameViewer();
    }

    function closeSequenceFrames() {
      $("sequenceFramesModal").classList.add("hidden");
      sequenceFrameViewer.frames = [];
      sequenceFrameViewer.index = 0;
      $("sequenceFrameStage").innerHTML = `<div class="empty">${escapeHTML(t("loadingSequenceImages"))}</div>`;
      updateSequenceFrameViewer();
    }

    function findGaitSequence(group, id) {
      const list = group === "gait1" ? state.gait.seq1 : state.gait.seq2;
      return list.find((item) => item.id === id);
    }

    async function compareGait() {
      try {
        const left = state.gait.seq1.find((item) => item.id === state.gait.selected1);
        let rights = state.gait.selected2.map((id) => state.gait.seq2.find((item) => item.id === id)).filter(Boolean);
        if (!left || !rights.length) throw new Error(t("needGaitSelection"));
        const pending = [left].concat(rights).filter((seq) => seq && !seq.feature && !isDemoGaitSequence(seq));
        if (pending.length > 0) {
          const pendingFrames = pending.reduce((sum, seq) => sum + ((seq && seq.frames) ? seq.frames.length : 0), 0);
          const confirmed = await showChargeNotice("sequence", pending.length, state.apiMode === "manual", pendingFrames);
          if (!confirmed) return;
        }
        state.gait.comparing = true;
        updateActionButtons();
        if (pending.length > 0) setStatus(t("extractingSelectedFeatures"));
        resetChargeBatchSummary("sequence");
        state.chargeBatchActive = true;
        const failedItems = [];
        try {
          let readyLeftItems = [];
          try {
            readyLeftItems = await ensureFeature(left, state.gait.seq1, { silentCharge: state.apiMode === "auto" });
          } catch (error) {
            left.status = "error";
            left.errorMessage = error.message || t("apiFailedStatus");
            failedItems.push({ label: t("video1"), message: left.errorMessage });
            renderGaitSequences();
          }
          const readyLeft = readyLeftItems && readyLeftItems[0];
          if (!readyLeft || !readyLeft.feature) throw new Error(t("invalidLeftSequence"));
          rights = state.gait.selected2.map((id) => state.gait.seq2.find((item) => item.id === id)).filter(Boolean);
          for (let index = 0; index < rights.length; index += 1) {
            const item = rights[index];
            let readyItems = [];
            try {
              readyItems = await ensureFeature(item, state.gait.seq2, { silentCharge: state.apiMode === "auto" });
            } catch (error) {
              item.status = "error";
              item.errorMessage = error.message || t("apiFailedStatus");
              failedItems.push({ label: t("sequenceLabel", { index: index + 1 }), message: item.errorMessage });
              renderGaitSequences();
              continue;
            }
            for (const ready of readyItems || []) {
              if (ready && ready.feature) {
                const sim = featureSimilarity(readyLeft.feature, ready.feature);
                ready.similarity = sim.score;
              }
            }
          }
        } finally {
          state.chargeBatchActive = false;
        }
        renderGaitSequences();
        if (failedItems.length) {
          setStatus(`有 ${failedItems.length} 个序列提特征失败。鼠标悬停到失败序列可查看原因。`, "error");
        } else {
          const batchMessageHTML = chargeBatchResultMessageHTML();
          if (batchMessageHTML) setStatusHTML(batchMessageHTML, "ok");
          else setStatus("");
        }
      } catch (error) {
        const message = error.message || t("compareFailed");
        if (error.chargeMessageHTML) setChargeStatusHTML("sequence", error.chargeMessageHTML, "error");
        else if (isTrialQuotaMessage(message)) setChargeStatus("sequence", message, "error");
        else setStatus(message, "error");
      } finally {
        state.chargeBatchActive = false;
        state.gait.comparing = false;
        updateActionButtons();
      }
    }

    function bindEvents() {
      document.querySelectorAll(".algorithm-tabs button").forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });
      document.querySelectorAll("[data-identity]").forEach((button) => {
        button.addEventListener("click", () => setIdentityMode(button.dataset.identity));
      });
      document.querySelectorAll("[data-api-mode]").forEach((button) => {
        button.addEventListener("click", () => setAPIMode(button.dataset.apiMode));
      });
      $("locateImage").addEventListener("change", () => {
        state.locateImage = updateFileLabel("locateImage", "locateImageLabel", t("uploadImage"));
        if (state.locateImage) {
          readFileAsDataURL(state.locateImage).then(loadImage).then((image) => drawLocate(image, [])).catch((error) => setStatus(error.message, "error"));
        }
      });
      $("poseVideoInput").addEventListener("change", () => {
        if (state.pose.abortController) state.pose.abortController.abort();
        state.pose.file = updateFileLabel("poseVideoInput", "poseVideoLabel", t("uploadVideo"));
        state.examples.pose.selectedVideo = "";
        renderExampleVideos();
        clearPoseVideoState();
        if (state.pose.file) {
          extractPoseSequences().catch((error) => setPoseParseStatus(error.message || t("poseFailed"), "error"));
        }
      });
      $("gaitVideo1Input").addEventListener("change", () => {
        if (state.gait.abort1) state.gait.abort1.abort();
        state.gait.file1 = updateFileLabel("gaitVideo1Input", "gaitVideo1Label", t("uploadVideo1"));
        state.examples.gait.selectedVideo1 = "";
        renderExampleVideos();
        clearGaitVideoState("video1");
        if (state.gait.file1) {
          extractGaitVideo("video1").catch((error) => setStatus(error.message || t("gaitFailed"), "error"));
        }
      });
      $("gaitVideo2Input").addEventListener("change", () => {
        if (state.gait.abort2) state.gait.abort2.abort();
        state.gait.file2 = updateFileLabel("gaitVideo2Input", "gaitVideo2Label", t("uploadVideo2"));
        state.examples.gait.selectedVideo2 = "";
        renderExampleVideos();
        clearGaitVideoState("video2");
        readVideoDuration(state.gait.file2).then(setGaitVideo2Duration);
        if (state.gait.file2) {
          extractGaitVideo("video2").catch((error) => setStatus(error.message || t("gaitFailed"), "error"));
        }
      });
      $("gaitRangeStart").addEventListener("change", applyGaitTimeRange);
      $("gaitRangeEnd").addEventListener("change", applyGaitTimeRange);
      $("locateRun").addEventListener("click", runLocate);
      $("poseExtract").addEventListener("click", extractSelectedPoseSequence);
      $("gaitExtract").addEventListener("click", pauseGaitExtraction);
      $("gaitCompare").addEventListener("click", compareGait);
      $("gaitSelectAll").addEventListener("click", toggleGaitSelectAll);
      $("gaitSort").addEventListener("click", toggleGaitSort);
      $("gaitPagePrev").addEventListener("click", () => changeGaitSeq2Page(-1));
      $("gaitPageNext").addEventListener("click", () => changeGaitSeq2Page(1));
      $("poseExampleList").addEventListener("click", (event) => {
        const card = event.target.closest("[data-example-action='pose-example']");
        if (card) selectPoseExampleVideo(card.dataset.id);
      });
      $("gaitVideo1ExampleList").addEventListener("click", (event) => {
        const card = event.target.closest("[data-example-action='gait-example-1']");
        if (card) selectGaitExampleVideo("video1", card.dataset.id);
      });
      $("gaitVideo2ExampleList").addEventListener("click", (event) => {
        const card = event.target.closest("[data-example-action='gait-example-2']");
        if (card) selectGaitExampleVideo("video2", card.dataset.id);
      });
      $("poseSeqList").addEventListener("click", (event) => {
        const card = event.target.closest(".sequence-card");
        if (card) selectPoseSequence(card.dataset.id);
      });
      $("gaitSeq1List").addEventListener("click", (event) => {
        const card = event.target.closest(".sequence-card");
        if (!card) return;
        selectGaitSequence("gait1", card.dataset.id);
      });
      $("gaitSeq2List").addEventListener("click", (event) => {
        const card = event.target.closest(".sequence-card");
        if (!card) return;
        selectGaitSequence("gait2", card.dataset.id);
      });
      $("posePlayBoth").addEventListener("click", () => {
        $("pose2DVideo").play().catch(() => {});
        syncPose3DTo2DVideo();
      });
      $("posePauseBoth").addEventListener("click", () => {
        $("pose2DVideo").pause();
      });
      bindPose3DCanvasControls();
      $("apiKey").addEventListener("change", () => saveAPIKeyConfig().catch(() => {}));
      $("apiKey").addEventListener("blur", () => saveAPIKeyConfig().catch(() => {}));
      $("chooseCacheDirInline").addEventListener("click", openSettingsModal);
      $("chooseCacheDir").addEventListener("click", () => chooseCacheDirectory().catch((error) => updateCacheStatus(error.message || t("cacheFailed"))));
      $("skipCacheDir").addEventListener("click", () => $("cacheModal").classList.add("hidden"));
      $("closeNoticeModal").addEventListener("click", () => closeNoticeModal(false));
      $("noticeModalConfirm").addEventListener("click", () => closeNoticeModal(true));
      $("noticeModal").addEventListener("click", (event) => {
        if (event.target.id === "noticeModal") closeNoticeModal();
      });
      ["settingFrameJump", "settingMinBoxWidth", "settingMinBoxHeight", "settingMinFrames", "settingMaxFrames", "settingKeepStatic"].forEach((id) => {
        $(id).addEventListener("change", () => saveBrowserSettings().catch((error) => updateCacheStatus(error.message || t("cacheFailed"))));
      });
      $("sequenceFramePrev").addEventListener("click", () => stepSequenceFrame(-1));
      $("sequenceFrameNext").addEventListener("click", () => stepSequenceFrame(1));
      $("closeSequenceFrames").addEventListener("click", closeSequenceFrames);
      $("sequenceFramesModal").addEventListener("click", (event) => {
        if (event.target.id === "sequenceFramesModal") closeSequenceFrames();
      });
      window.addEventListener("keydown", (event) => {
        if ($("sequenceFramesModal").classList.contains("hidden")) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          stepSequenceFrame(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          stepSequenceFrame(1);
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeSequenceFrames();
        }
      });
      window.addEventListener("resize", () => {
        if (state.mode === "gait") renderGaitSequences();
      });
      $("localeSelect").addEventListener("change", (event) => {
        state.locale = event.target.value;
        localStorage.setItem("wAgentBrowserLocale", state.locale);
        applyLocale();
      });
      syncPoseVideos();
    }

    $("localeSelect").value = state.locale;
    document.documentElement.lang = state.locale;
    configureClientVariant();
    setIdentityMode(identity());
    setAPIMode(state.apiMode, { skipSave: true });
    updateCacheStatus(t("cacheUnset"));
    bindEvents();
    initCacheDirectory();
    loadSessionAPIKey().catch(() => {});
    loadExampleManifests().catch(() => {});
    setMode(defaultMode);
    applyLocale();
  </script>
</body>
</html>
